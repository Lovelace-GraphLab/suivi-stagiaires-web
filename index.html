<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suivi Stagiaires · Lovelace</title>
<!-- installable sur l'écran d'accueil du téléphone (Safari › Partager › Sur l'écran d'accueil) -->
<link rel="manifest" href="assets/manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stagiaires">
<meta name="theme-color" content="#3a2214">
<style>
@font-face{font-family:Palmore;src:url(assets/fonts/Palmore-Light.otf);font-weight:300}
@font-face{font-family:Palmore;src:url(assets/fonts/Palmore.otf);font-weight:400}
@font-face{font-family:Palmore;src:url(assets/fonts/Palmore-Semibold.otf);font-weight:600}
@font-face{font-family:Palmore;src:url(assets/fonts/Palmore-Bold.otf);font-weight:700}
@font-face{font-family:'Mainly Note';src:url(assets/fonts/MainlyNote.ttf)}
@font-face{font-family:'League Spartan';src:url(assets/fonts/LeagueSpartan-Regular.ttf);font-weight:400}
@font-face{font-family:'League Spartan';src:url(assets/fonts/LeagueSpartan-SemiBold.ttf);font-weight:600}
:root{
  color-scheme:light;
  --brick:#892f13; --brick-d:#6b240e; --mustard:#fdb125; --cream:#fcf1d9; --paper:#fffaf0;
  --ink:#3b2116; --muted:#654e40; --line:#d6c7b2; --green:#3f7a2e; --blue:#2f62a0; --tut:#6b3fa0;
  --fd:'Palmore',Georgia,serif; --fh:'Mainly Note','Segoe Print',cursive; --fb:'League Spartan',system-ui,sans-serif;
  --kraft:url(assets/kraft.jpg); --rouge:url(assets/papier-rouge.jpg); --creme:url(assets/papier-creme.jpg); --jaune:url(assets/papier-jaune.jpg);
}
*{box-sizing:border-box}
body{margin:0;font:17px/1.45 var(--fb);color:var(--ink);background:#3a2214 url(assets/bois.jpg) center/cover fixed;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
.hint{font-size:14.5px;color:var(--muted)}
.hand{font-family:var(--fb)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.empty{color:var(--muted);text-align:center;padding:10px 0;font-size:16px;font-style:italic}
.err{color:var(--brick);font-weight:600}
.streak{font-weight:700;color:var(--brick)}

/* boutons */
.btn{border:1.5px solid rgba(59,33,22,.3);background:var(--cream);color:var(--ink);padding:10px 16px;border-radius:7px;cursor:pointer;font-weight:600;font-size:15px;letter-spacing:.02em;transition:transform .12s,box-shadow .12s;min-height:42px}
.btn:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.18)}
.btn.primary{background:var(--brick);border-color:var(--brick);color:var(--cream);text-transform:uppercase;letter-spacing:.12em;font-size:14.5px}
.btn.yellow{background:var(--mustard);border-color:var(--mustard);color:var(--ink);text-transform:uppercase;letter-spacing:.12em;font-size:14.5px}
.btn.danger{color:var(--brick);border-color:rgba(137,47,19,.45)}
.btn.sm{padding:6px 12px;font-size:14px;min-height:36px}
.btn.big{padding:16px;font-size:16.5px}
.btn.wood{background:rgba(0,0,0,.3);color:var(--cream);border-color:rgba(245,238,227,.4)}

/* ---------- cadre de l'appli : bureau, onglets, chemise ---------- */
#app{max-width:1680px;margin:auto;padding:20px 28px 56px}
#top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
#brand{display:flex;align-items:center;gap:16px;color:var(--cream)}
#syncdot{font-size:13px;font-weight:600;letter-spacing:.06em;color:rgba(252,241,217,.65);white-space:nowrap}
#syncdot.ok{color:#9fd98a}
#brand.click{cursor:pointer}
#brand .bn{font-family:var(--fd);font-weight:700;font-size:44px;line-height:.95;text-transform:uppercase;letter-spacing:.01em}
#brand .bs{font-size:16px;font-weight:600;letter-spacing:.04em;color:var(--mustard)}
#brand .xpbar{width:280px;height:10px;background:rgba(245,238,227,.22);margin-top:5px}
#brand .xpbar i{background:var(--mustard)}
.tools{display:flex;gap:10px;flex-wrap:wrap}
#tabs{display:flex;gap:8px;align-items:flex-end;padding:0 26px;position:relative;z-index:2;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#tabs .sp{flex:1;min-width:10px}
.tab{border:0;cursor:pointer;padding:19px 38px 15px;min-width:200px;border-radius:22px 22px 0 0;font-weight:600;font-size:16px;letter-spacing:.28em;text-transform:uppercase;color:var(--brick);
  background-size:700px;box-shadow:0 -3px 8px rgba(0,0,0,.25);transform:translateY(8px);transition:transform .15s;white-space:nowrap}
.tab:hover{transform:translateY(3px)}
.tab.on{transform:none;padding-bottom:23px}
.tab.kraft{background-image:var(--kraft)} .tab.rouge{background-image:var(--rouge);color:var(--cream)}
.tab.creme{background-image:var(--creme)} .tab.jaune{background-image:var(--jaune)}
.tab .dot{display:inline-grid;place-items:center;min-width:23px;height:23px;border-radius:99px;background:var(--mustard);color:var(--ink);font-size:13px;letter-spacing:0;margin-left:8px;padding:0 6px}
#folder{position:relative;border-radius:8px 22px 22px 22px;box-shadow:0 22px 50px rgba(0,0,0,.5);background-size:1100px;min-height:72vh}
#folder.f-kraft{background-image:var(--kraft)} #folder.f-rouge{background-image:var(--rouge)}
#folder.f-creme{background-image:var(--creme)} #folder.f-jaune{background-image:var(--jaune)}
#folder::after{content:'';position:absolute;right:-34px;bottom:-40px;width:130px;height:130px;background:url(assets/etoiles.png) center/contain no-repeat;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
main{padding:32px 32px 50px}
#tbar{background:var(--tut);color:#fff;padding:12px 24px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-weight:600;font-size:16px;border-radius:8px 22px 0 0}
#tbar .btn{background:#fff;color:var(--tut);border:0}
#tbar.warn{background:var(--brick)}
@media (max-width:1100px){.tab{min-width:0;padding:16px 24px 13px;letter-spacing:.2em;font-size:15px}}
@media (max-width:760px){
  #app{padding:12px 10px 40px} main{padding:22px 14px 36px}
  .tab{padding:14px 16px 11px;letter-spacing:.12em;font-size:14px}
  #brand .bn{font-size:32px} #brand .xpbar{width:200px} #folder::after{display:none}
}

/* titres */
.title{font-family:var(--fd);font-weight:700;text-transform:uppercase;color:var(--brick);line-height:.95;margin:0;letter-spacing:.01em}
.f-rouge .title,.f-rouge .empty{color:var(--cream)}
.f-rouge .note .title,.f-rouge .note .empty{color:var(--brick)}
.kicker{font-weight:600;font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:var(--brick)}

/* ---------- papiers ---------- */
.tape{position:absolute;width:160px;height:42px;background:url(assets/scotch.webp) center/100% 100% no-repeat;top:-17px;left:calc(50% - 80px);transform:rotate(-3deg);filter:drop-shadow(0 2px 2px rgba(0,0,0,.15));pointer-events:none;z-index:2}
.note{position:relative;background:var(--jaune) center/700px;box-shadow:0 10px 22px rgba(0,0,0,.3);border-radius:2px;padding:22px}
.note.creme{background-image:var(--creme)}
.lined{position:relative;background:
  linear-gradient(90deg,transparent 18px,#eab2ad 18px 19px,transparent 19px 22px,#eab2ad 22px 23px,transparent 23px),
  repeating-linear-gradient(transparent 0 33px,#e1e8f3 33px 34px) 0 62px/100% calc(100% - 62px) no-repeat,var(--paper);
  box-shadow:0 10px 22px rgba(0,0,0,.28);border-radius:2px}
.lined::after{content:'';position:absolute;left:0;right:0;bottom:-9px;height:10px;
  background:linear-gradient(-45deg,transparent 6px,var(--paper) 0) 0 0/12px 10px repeat-x,linear-gradient(45deg,transparent 6px,var(--paper) 0) 0 0/12px 10px repeat-x}

/* ---------- semaine ---------- */
.weekbar{display:flex;align-items:center;gap:12px;margin-bottom:26px;flex-wrap:wrap}
.weekbar .title{font-size:46px;margin:0 6px}
.stagebox{position:relative;margin-left:auto;min-width:340px;transform:rotate(1deg);padding:30px 44px 30px 34px;background:url(assets/papier-quadrille.webp) center/100% 100% no-repeat;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3))}
.stagebox .clip{position:absolute;top:-34px;left:40%;height:74px;transform:rotate(-6deg)}
.stagebox .title{font-size:30px}
.stagebox .info{font-size:15px}
/* 3 jours par ligne en plein écran (lun-mar-mer / jeu-ven), 2 sur écran moyen, 1 sur mobile */
.week{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 24px;margin-bottom:46px}
@media (min-width:1200px){.week{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.week{grid-template-columns:1fr}}
.day{padding:50px 16px 26px 34px;display:flex;flex-direction:column;gap:10px;min-height:340px;transform:rotate(var(--r,0deg));transition:outline .1s}
.day::before{content:'';position:absolute;top:16px;left:calc(50% - 60px);width:120px;height:14px;background:radial-gradient(circle at 7px 7px,rgba(70,40,20,.55) 5px,transparent 6px) 0 0/24px 14px repeat-x}
.day.today{--r:0deg!important;box-shadow:0 0 0 4px var(--mustard),0 14px 28px rgba(0,0,0,.35)}
.day{transition:transform .18s ease,box-shadow .18s ease}
.day.over{outline:3px dashed var(--brick);outline-offset:4px;transform:rotate(var(--r,0deg)) translateY(-3px) scale(1.01);box-shadow:0 0 0 6px rgba(253,177,37,.35),0 12px 26px rgba(0,0,0,.18)}
.dayhead{display:flex;flex-direction:column;gap:2px}
.dayhead .title{font-size:38px}
.dayhead .hand{font-size:14px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;line-height:1.3}
.today .dayhead .hand{color:var(--brick)}
.prog{height:6px;background:rgba(59,33,22,.12);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);transition:width .25s}
.task{display:flex;gap:8px;align-items:flex-start;padding:9px 8px 8px;background:#fff;border:1px solid #e6ddcf;border-left:5px solid #e6ddcf;border-radius:7px;cursor:grab}
.task.p-high{border-left-color:var(--brick)} .task.p-low{border-left-color:var(--blue)}
.task{transition:transform .15s ease,box-shadow .15s ease}
/* on « décolle » la tâche quand on l'attrape (pas en cochant) */
.task:active:not(:has(input:active,button:active)){transform:rotate(-2deg) scale(1.04);box-shadow:0 10px 22px rgba(0,0,0,.22);cursor:grabbing;position:relative;z-index:2}
.task.dragging{opacity:.35;transform:none;box-shadow:none;border-style:dashed}
@media (prefers-reduced-motion:reduce){.task,.day{transition:none}.task:active,.day.over{transform:none}}
.task input[type=checkbox]{margin-top:1px;width:22px;height:22px;accent-color:var(--brick);cursor:pointer;flex:none}
.task .t{display:block;width:100%;background:none;border:0;text-align:left;padding:0;cursor:pointer;word-break:break-word;font-size:17px;line-height:1.3}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.prio{border:1px solid var(--line);background:#fff;cursor:pointer;padding:0 8px;font-size:12.5px;line-height:22px;border-radius:99px;color:var(--muted);flex:none}
.prio.high{color:#fff;background:var(--brick);border-color:var(--brick)} .prio.low{color:#fff;background:var(--blue);border-color:var(--blue)}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.chip{font-size:13px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);word-break:break-word;background:#fff;line-height:1.5}
.chip.carry{color:var(--brick);border-color:var(--brick)}
.chip.flag{color:#fff;background:var(--brick);border-color:var(--brick);font-weight:600;font-size:14px;padding:4px 10px}
.chip.grad{color:#fff;background:var(--green);border-color:var(--green);font-weight:600;font-size:14px;padding:4px 10px}
.chip.tut{color:var(--tut);border-color:var(--tut)}
.add{display:flex;flex-direction:column;gap:6px;margin-top:auto;padding-top:6px}
.add input[type=text],.add select{width:100%;min-width:0;padding:8px 10px;border:1.5px dashed #c6b49c;border-radius:7px;background:rgba(255,255,255,.7)}
.add input[type=text]{font-size:16px}
.add select{display:none;font-size:15px}
.add:focus-within select{display:block}
.tip{display:inline-block;margin-top:28px;background:var(--cream);color:var(--ink);font-size:15px;padding:10px 16px;border-radius:6px;box-shadow:0 4px 10px rgba(0,0,0,.2)}

/* calendrier : feuille de cahier, sous la semaine */
.calbox{position:relative;display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:34px;padding:78px calc(5.5% + 26px) 70px calc(12.5% + 18px);
  background:url(assets/feuille-cahier.webp) center/100% 100% no-repeat;filter:drop-shadow(0 12px 16px rgba(0,0,0,.3));transform:rotate(-.3deg)}
.calbox>div:first-of-type{max-width:400px;width:100%}
@media (max-width:900px){.calbox{grid-template-columns:1fr;padding:64px 22px 60px 22px;background:var(--paper)}}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhead .title{font-size:32px;text-transform:uppercase}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dh{font-size:13px;color:var(--muted);font-weight:600;padding:2px 0}
.cal .c{position:relative;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;font-size:16px;cursor:pointer;border:2px solid transparent}
.cal .c:hover{background:rgba(253,177,37,.25)}
.cal .c.we{color:#a39380}
.cal .c.wk{background:rgba(253,177,37,.2)}
.cal .c.td{border-color:var(--brick);font-weight:700}
.cal .c.dl{background:var(--brick);color:#fff;font-weight:700}
.cal .c.dl.soon{background:var(--mustard);color:var(--ink)}
.cal .c.dl.ok{background:var(--green)}
.cal .c i{position:absolute;top:-3px;right:-2px;font-size:11px;font-style:normal;background:var(--ink);color:#fff;border-radius:99px;min-width:17px;line-height:17px}
.cal .c u{position:absolute;bottom:-7px;left:0;right:0;font-size:12px;text-decoration:none}
.dllist{display:flex;flex-direction:column;gap:9px;min-width:0}
.dllist .title{font-size:32px;margin-bottom:6px}
.dli{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:11px 14px;background:#fff;cursor:pointer;border-left:6px solid var(--mustard)}
.dli:hover{background:#fffaf0}
.dli.late{border-left-color:var(--brick)}
.dli .n{flex:1;min-width:0;word-break:break-word;font-weight:600;font-size:17px}
.dli small{color:var(--muted);text-align:right;font-size:14.5px;line-height:1.3}
.dli.late small{color:var(--brick);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:12px}
.legend span:before{content:'';display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;background:var(--c);vertical-align:-1px}

/* ---------- projets : post-it sur chemise rouge ---------- */
.filters{display:flex;gap:10px;margin-bottom:38px;flex-wrap:wrap;align-items:center}
.f-rouge .filters .btn:not(.yellow){background:transparent;color:var(--cream);border-color:rgba(245,238,227,.5)}
.f-rouge .filters .btn.on{background:var(--cream);color:var(--brick);border-color:var(--cream)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:38px 28px}
.pcard{position:relative;cursor:pointer;display:flex;flex-direction:column;gap:11px;padding:30px 22px 20px;transform:rotate(var(--r,0deg));transition:transform .15s}
.pcard:nth-child(even){background-image:var(--creme)}
.pcard:hover{transform:rotate(0) translateY(-4px)}
.pcard .title{font-size:36px;word-break:break-word}
.pcard .pclient{margin-top:-10px;font-weight:600;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--brick)}
.pcard .clip{position:absolute;top:-28px;right:28px;height:80px;transform:rotate(10deg);filter:drop-shadow(1px 2px 1px rgba(0,0,0,.3))}
.pcard .hint{color:var(--ink)}
.badge{display:inline-block;font-size:13px;font-weight:600;padding:4px 11px 3px;border-radius:5px;color:#fff;background:#7a6a5c;white-space:nowrap;text-transform:uppercase;letter-spacing:.06em}
.badge.review{background:var(--tut)}
.fcoms{display:flex;flex-direction:column;gap:6px}
.fcom{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--jaune) center/500px;border-radius:4px;padding:8px 10px;font-size:14px;box-shadow:0 2px 5px rgba(0,0,0,.12)}
.fcom span{flex:1;min-width:0;word-break:break-word}
.fcom small{color:var(--muted)}
.fcom.done{background:#efe8da;opacity:.75}
.fcom.done span{text-decoration:line-through}
.tutorbox{display:flex;flex-direction:column;gap:10px;background:rgba(107,63,160,.08);border:2px solid var(--tut);border-radius:10px;padding:14px}
.tutorbox textarea{min-height:80px}
.vbox{border-radius:8px;padding:10px 14px;font-weight:600}
.vbox.ok{background:rgba(63,122,46,.12);color:var(--green)}
.vbox.wait{background:rgba(107,63,160,.1);color:var(--tut)}
.badge.doing{background:var(--mustard);color:var(--ink)} .badge.done,.badge.ok{background:var(--green)} .badge.late,.badge.fix{background:var(--brick)} .badge.pending{background:var(--tut)}
.note .badge.doing{background:var(--ink);color:var(--mustard)}
.badge.ghost{background:rgba(255,255,255,.6);color:var(--ink);border:1.5px solid rgba(59,33,22,.4)}

/* ---------- dialogues ---------- */
dialog{border:0;border-radius:6px;padding:0;background:var(--creme) center/800px;color:var(--ink);width:min(820px,94vw);max-height:92vh;box-shadow:0 26px 70px rgba(0,0,0,.55)}
dialog::backdrop{background:rgba(30,15,8,.6)}
.dlg{padding:30px;display:flex;flex-direction:column;gap:16px}
.dlg .title{font-size:42px}
.dlg label{display:flex;flex-direction:column;gap:6px;font-size:13.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--brick);font-weight:600}
.dlg input,.dlg select,.dlg textarea{padding:11px 13px;border:1.5px solid var(--line);border-radius:7px;background:#fffdf8;font-weight:400;font-size:17px;letter-spacing:0;text-transform:none;color:var(--ink)}
.dlg textarea{min-height:120px;resize:vertical}
.dlg input[type=checkbox]{width:21px;height:21px;padding:0;accent-color:var(--brick)}
.dlg h4{margin:8px 0 0;font-family:var(--fd);font-weight:700;font-size:30px;text-transform:uppercase;color:var(--brick)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.drop{border:2px dashed #c6b49c;border-radius:10px;padding:22px;text-align:center;color:var(--muted);cursor:pointer;background:rgba(255,255,255,.55);font-size:17px;font-weight:600}
.drop .hint{font-family:var(--fb)}
.drop.over{border-color:var(--brick);background:rgba(253,177,37,.2)}
.file{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fffdf8;font-size:16px}
.file .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file small{color:var(--muted);font-size:13.5px}
.file a{color:var(--brick);cursor:pointer;text-decoration:none;font-size:14.5px;font-weight:600}
.thumb{width:56px;height:56px;border-radius:4px;object-fit:cover;flex:none;background:var(--cream);display:grid;place-items:center;font-size:28px;cursor:pointer;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:24px;line-height:1;padding:2px 6px}
.x:hover{color:var(--brick)}
.ver{border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:10px;background:rgba(255,255,255,.55);border:1px solid var(--line);border-left:6px solid var(--tut)}
.ver.ok{border-left-color:var(--green)} .ver.fix{border-left-color:var(--brick)}
.vc{background:var(--jaune) center/600px;border-radius:2px;padding:12px 14px;font-family:var(--fh);font-size:22px;white-space:pre-wrap;box-shadow:0 3px 8px rgba(0,0,0,.15)}
.ver textarea{min-height:64px}
.step{display:flex;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fffdf8;font-size:16.5px}
.step .n{flex:1;min-width:0;word-break:break-word}
.step.done .n{text-decoration:line-through;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:10px}
.checks label{flex-direction:row;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:99px;padding:8px 15px;color:var(--ink);cursor:pointer;background:#fffdf8;letter-spacing:0;text-transform:none;font-size:16px}

/* ---------- jeu ---------- */
.avatar{position:relative;flex:none;width:68px;height:68px;border-radius:50%;background:var(--cream);border:4px solid #fffaf0;display:grid;place-items:center;font-size:36px;box-shadow:0 4px 10px rgba(0,0,0,.35)}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;transform:scale(1.12)}
.avatar b{position:absolute;right:-7px;bottom:-7px;background:var(--brick);color:var(--cream);font-size:14px;min-width:28px;height:28px;border-radius:99px;display:grid;place-items:center;border:2px solid #fffaf0;padding:0 5px}
.avatar.sm{width:52px;height:52px;font-size:27px;border-width:3px}
.avatar.sm b{font-size:12px;min-width:23px;height:23px;right:-6px;bottom:-6px}
.avatar.xl{width:124px;height:124px;font-size:68px;border-width:6px}
.avatar.xl b{font-size:18px;min-width:38px;height:38px}
.xpbar{height:12px;border-radius:9px;background:rgba(59,33,22,.15);overflow:hidden;margin:6px 0 4px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--mustard),var(--brick));transition:width .5s}
.xpbar.green i{background:linear-gradient(90deg,#8fbb6f,var(--green))}
/* bulle du compagnon (rappels) */
#buddies{position:fixed;left:20px;bottom:20px;z-index:70;display:flex;flex-direction:column;gap:12px;max-width:min(430px,calc(100vw - 40px))}
.buddy{display:flex;gap:12px;align-items:flex-end;animation:bIn .5s cubic-bezier(.2,1.4,.4,1) both}
.buddy.out{animation:bOut .3s forwards}
.bav{flex:none;width:96px;height:96px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));animation:bHop 1s .4s ease-out}
.bav img{width:100%;height:100%;object-fit:contain}
.btxt{position:relative;background:var(--creme) center/500px;border-radius:14px;padding:12px 14px;box-shadow:0 10px 24px rgba(0,0,0,.35);margin-bottom:22px}
.btxt::before{content:'';position:absolute;left:-9px;bottom:16px;border:10px solid transparent;border-right-color:#f3ebdd;border-left:0}
.btxt p{margin:4px 0 10px;font-size:15.5px;line-height:1.4}
.bwho{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--brick)}
@keyframes bIn{from{opacity:0;transform:translateY(30px) scale(.9)}}
@keyframes bOut{to{opacity:0;transform:translateY(20px)}}
@keyframes bHop{30%{transform:translateY(-14px)}60%{transform:translateY(0)}80%{transform:translateY(-5px)}}
@media print{#buddies{display:none}}
/* grosse alerte d'inactivité */
.idle{position:fixed;inset:0;z-index:110;display:grid;place-items:center;background:rgba(30,15,8,.8);padding:20px;animation:cIn .3s ease-out}
.idle.out{animation:cOut .3s forwards}
.idlebox{position:relative;width:min(520px,100%);background:var(--creme) center/700px;border-radius:18px;padding:30px 28px 28px;text-align:center;
  box-shadow:0 30px 80px rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;gap:8px;animation:iShake .7s .25s both}
.idlebox .iav{width:190px;height:190px;margin-top:-110px;filter:drop-shadow(0 12px 18px rgba(0,0,0,.45));animation:bHop 1.2s .6s ease-out 2}
.idlebox .iav img{width:100%;height:100%;object-fit:contain}
.idlebox .title{font-size:48px}
.idlebox p{font-size:18px;line-height:1.45;margin:4px 0 14px}
@keyframes iShake{0%{opacity:0;transform:scale(.7)}40%{opacity:1;transform:scale(1.04)}55%{transform:rotate(-2deg)}70%{transform:rotate(2deg)}85%{transform:rotate(-1deg)}100%{transform:none}}
.remind{margin-top:18px;padding-top:14px;border-top:1px dashed rgba(59,33,22,.3);display:flex;flex-direction:column;align-items:center;gap:6px}
#toasts{position:fixed;right:20px;bottom:20px;z-index:60;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none}
.toast{background:var(--jaune) center/500px;color:var(--ink);padding:12px 20px;border-radius:4px;font-weight:600;font-size:17px;box-shadow:0 8px 20px rgba(0,0,0,.35);transform:rotate(-1deg);animation:pop .3s,out .4s 3.6s forwards}
.toast.big{background:var(--rouge) center/500px;color:var(--cream);transform:rotate(.8deg)}
@keyframes pop{from{transform:translateY(14px) scale(.9);opacity:0}}
@keyframes out{to{opacity:0;transform:translateY(-6px)}}

/* polaroïd (fenêtre photo : 16,3 % → 86 % en largeur, 12 % → 72 % en hauteur de l'image) */
.polaroid{position:relative;width:230px;aspect-ratio:1679/2000;margin:0 auto;transform:rotate(-3deg);filter:drop-shadow(0 10px 12px rgba(0,0,0,.3))}
.polaroid::before{content:'';position:absolute;inset:0;background:url(assets/polaroid.webp) center/100% 100% no-repeat}
.polaroid .ph{position:absolute;left:16.3%;top:12%;width:69.8%;height:60%;background:var(--rouge) center/500px;display:grid;place-items:center;font-size:100px}
.polaroid .cap{position:absolute;left:12%;right:12%;top:74%;height:14%;display:grid;place-items:center;font-family:var(--fd);font-weight:700;font-size:34px;color:var(--brick);text-transform:uppercase}

.polaroid .ph img{width:100%;height:100%;object-fit:contain}
/* profil */
.profile{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:40px;align-items:start}
@media (max-width:950px){.profile{grid-template-columns:1fr}}
.profile .note{padding:38px 26px 28px;transform:rotate(-.6deg);text-align:center}
.profile .note .title{font-size:52px;margin-top:14px}
.profile .note .hint{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{background:#fffdf8;border-radius:10px;padding:12px 8px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.12);transform:rotate(var(--r,0deg))}
.stat b{display:block;font-family:var(--fd);font-weight:700;font-size:42px;color:var(--brick);line-height:1}
.stat small{color:var(--muted);font-size:14px}
.path{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.stage{text-align:center;border-radius:14px;padding:10px 8px 12px;background:#fffdf8;font-size:14px;box-shadow:0 3px 8px rgba(0,0,0,.15);border:3px solid #fff;line-height:1.2}
.stage img{display:block;width:100%;aspect-ratio:1;object-fit:contain}
.stage .sn{font-weight:600;margin-top:4px}
.stage small{color:var(--muted)}
.stage.cur{background:var(--mustard);transform:rotate(-1.5deg) scale(1.05);box-shadow:0 8px 18px rgba(0,0,0,.25)}
.stage.lock img{filter:brightness(0) opacity(.22)}   /* silhouette tant que la forme n'est pas débloquée */
.stage.lock .sn{color:var(--muted)}
/* grand portrait du profil */
.hero{position:relative;width:min(260px,100%);margin:6px auto 0}
.hero img{display:block;width:100%;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(0,0,0,.25))}
.hero b{position:absolute;right:8px;bottom:8px;background:var(--brick);color:var(--cream);font-size:18px;min-width:40px;height:40px;border-radius:99px;display:grid;place-items:center;border:3px solid #fffaf0;padding:0 6px}
/* choix du compagnon */
.starters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.starter{position:relative;display:flex!important;flex-direction:column;align-items:center;gap:2px!important;padding:10px 8px 12px;border-radius:14px;background:#fffdf8;border:3px solid #fff;
  box-shadow:0 3px 8px rgba(0,0,0,.15);cursor:pointer;text-align:center;text-transform:none!important;letter-spacing:0!important;color:var(--ink)!important;transition:transform .15s}
.starter:hover{transform:translateY(-3px)}
.starter input{position:absolute;opacity:0;pointer-events:none}
.starter img{width:100%;aspect-ratio:1;object-fit:contain}
.starter b{font-size:15px}
.starter small{font-size:12.5px;color:var(--muted);font-weight:400}
.starter:has(input:checked){border-color:var(--brick);background:var(--mustard);transform:scale(1.04)}
.starter:has(input:focus-visible){outline:3px solid var(--mustard);outline-offset:2px}
@media (max-width:520px){.starters{grid-template-columns:1fr 1fr 1fr;gap:6px}.starter b{font-size:12.5px}.starter small{display:none}}

/* ---------- célébrations : niveau supérieur et nouvelle forme ---------- */
.celeb{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(30,15,8,.78);cursor:pointer;overflow:hidden;animation:cIn .35s ease-out}
.celeb.out{animation:cOut .4s forwards}
@keyframes cIn{from{opacity:0}} @keyframes cOut{to{opacity:0}}
.celeb .rays{position:absolute;width:170vmax;height:170vmax;left:calc(50% - 85vmax);top:calc(50% - 85vmax);background:repeating-conic-gradient(rgba(253,177,37,.2) 0 9deg,transparent 9deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 45%);mask:radial-gradient(circle,#000 0,transparent 45%);animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cbox{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--cream);padding:20px}
.cbox .kicker{color:var(--mustard);font-size:18px;animation:up .5s .1s both}
.lvl{display:flex;flex-direction:column;align-items:center;font-family:var(--fd);font-weight:700;text-transform:uppercase;line-height:.82}
.lvl span{font-size:46px;animation:up .5s .2s both}
.lvl b{font-size:190px;color:var(--mustard);text-shadow:0 7px 0 var(--brick),0 16px 30px rgba(0,0,0,.5);animation:pop2 .75s .35s cubic-bezier(.2,1.6,.4,1) both}
.cav{width:min(240px,55vw);aspect-ratio:1;animation:bounce 1.1s .7s ease-out both}
.cav img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 12px 20px rgba(0,0,0,.5))}
.csub{font-size:20px;font-weight:600;animation:up .5s 1s both}
.ctap{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-size:13px;color:rgba(252,241,217,.6);letter-spacing:.2em;text-transform:uppercase;animation:up .5s 1.6s both}
@keyframes up{from{opacity:0;transform:translateY(22px)}}
@keyframes pop2{from{opacity:0;transform:scale(.2) rotate(-14deg)}}
@keyframes bounce{0%{opacity:0;transform:translateY(50px) scale(.6)}45%{opacity:1;transform:translateY(-16px) scale(1.06)}75%{transform:translateY(4px)}100%{transform:none}}
.evo{position:relative;width:min(400px,78vw);aspect-ratio:1;margin:6px 0}
.evo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 12px 22px rgba(0,0,0,.5))}
.evo .from{animation:charge 1.9s ease-in forwards}
.evo .to{opacity:0;animation:reveal 1s 1.95s cubic-bezier(.2,1.5,.4,1) forwards}
.evo .flashw{position:absolute;inset:-35%;border-radius:50%;background:radial-gradient(circle,#fff 0,rgba(253,177,37,.95) 28%,rgba(253,177,37,0) 64%);opacity:0;animation:flashw 1.1s 1.5s forwards}
@keyframes charge{0%{transform:none}50%{transform:scale(1.02)}55%{transform:translateX(-6px)}60%{transform:translateX(6px)}65%{transform:translateX(-6px)}70%{transform:translateX(6px) scale(1.04)}
  100%{transform:scale(1.1);filter:brightness(0) invert(1) drop-shadow(0 0 30px #fdb125);opacity:0}}
@keyframes reveal{from{opacity:0;transform:scale(.35)}to{opacity:1;transform:none}}
@keyframes flashw{0%{opacity:0;transform:scale(.3)}30%{opacity:1}100%{opacity:0;transform:scale(1.5)}}
.celeb.evolve .title{font-size:clamp(38px,6vw,64px);color:var(--mustard);text-shadow:0 5px 0 var(--brick);animation:up .6s 2.5s both}
.celeb.evolve .csub{animation-delay:2.8s}
/* trophées : illustration (ou emoji provisoire) */
.ticon{position:relative;display:inline-grid;place-items:center;width:52px;height:52px;flex:none}
.ticon img{width:100%;height:100%;object-fit:contain}
.ticon img+em{display:none}
.ticon em{font-style:normal;font-size:30px;line-height:1}
.tro.lock .ticon img{filter:brightness(0) opacity(.25)}
.tbadge{position:relative;width:min(260px,60vw);aspect-ratio:1;display:grid;place-items:center;margin:6px 0;animation:tPop .9s .25s cubic-bezier(.2,1.6,.4,1) both}
.tbadge .ticon{width:100%;height:100%}
.tbadge .ticon em{font-size:150px}
.tbadge .ticon img,.tbadge .ticon em{filter:drop-shadow(0 12px 20px rgba(0,0,0,.5));animation:tWobble 2.4s 1.1s ease-in-out infinite}
.tbadge .halo{position:absolute;inset:-18%;border-radius:50%;background:radial-gradient(circle,rgba(253,177,37,.75) 0,rgba(253,177,37,.25) 40%,transparent 68%);animation:tHalo 2s ease-in-out infinite}
@keyframes tPop{0%{opacity:0;transform:scale(.2) rotate(-25deg)}70%{transform:scale(1.08) rotate(4deg)}100%{opacity:1;transform:none}}
@keyframes tWobble{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-6px)}}
@keyframes tHalo{0%,100%{transform:scale(.9);opacity:.8}50%{transform:scale(1.08);opacity:1}}
.celeb.trophy .title{font-size:clamp(36px,5vw,58px);color:var(--mustard);text-shadow:0 5px 0 var(--brick);animation:up .5s .8s both}
.celeb.trophy .csub{animation-delay:1.1s}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;top:-24px;left:var(--x);width:11px;height:17px;border-radius:2px;background:var(--c);transform:rotate(var(--r));animation:fall 3s var(--d) linear both}
.celeb.evolve .confetti i{animation-delay:calc(var(--d) + 2s)}
@keyframes fall{to{transform:translateY(112vh) rotate(calc(var(--r) + 600deg))}}
@media (prefers-reduced-motion:reduce){.celeb *,.celeb{animation-duration:.01s!important;animation-delay:0s!important}.evo .from{display:none}.evo .to{opacity:1}}
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tro{display:flex;gap:12px;align-items:center;border-radius:14px;padding:11px 14px;background:#fffdf8;border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.18);transform:rotate(var(--r,0deg))}
.tro span{font-size:32px}
.tro b{font-family:var(--fd);font-weight:700;text-transform:uppercase;color:var(--brick);font-size:23px;line-height:1}
.tro small{display:block;color:var(--muted);line-height:1.3;font-size:14px;margin-top:2px}
/* trophée non obtenu : silhouette du visuel, texte atténué (comme les formes du personnage) */
.tro.lock b{color:var(--muted)}
.tro.lock small{opacity:.8}
.trophies .ticon{width:72px;height:72px}
.sect{margin:34px 0 16px;font-size:38px}
details{font-size:15.5px}
details summary{cursor:pointer;font-weight:600}

/* ---------- accueil ---------- */
.homewrap{min-height:100vh;display:grid;place-items:center;padding:30px 16px}
.homefolder{position:relative;width:min(620px,100%)}
.homefolder .tab{cursor:default;transform:none;margin-left:30px}
.homecard{background:var(--kraft) center/900px;border-radius:8px 22px 22px 22px;padding:38px 44px 46px;text-align:center;box-shadow:0 22px 50px rgba(0,0,0,.5);position:relative}
.homecard::after{content:'';position:absolute;right:-40px;bottom:-46px;width:120px;height:120px;background:url(assets/etoiles.png) center/contain no-repeat;pointer-events:none}
.homelogo{width:170px;display:block;margin:0 auto 6px}
.homecard .kicker{margin-top:6px}
.homecard h1{font-family:var(--fd);font-weight:700;font-size:76px;line-height:.9;color:var(--brick);text-transform:uppercase;margin:8px 0 0}
.homenote{display:inline-block;margin:20px auto 0;padding:14px 20px;font-family:var(--fh);font-size:25px;transform:rotate(-1deg)}
.homebtns{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.profiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:14px}
.btn.prof{display:flex;align-items:center;gap:12px;padding:12px 14px;font-size:19px;background:#fffdf8}
.pin{font-size:32px!important;letter-spacing:.5em;text-align:center;padding:12px!important;width:100%;border:1.5px solid var(--line);border-radius:7px;background:#fffdf8}
.homecard .dlg{padding:0}
@media (max-width:600px){.homecard{padding:30px 20px 36px}.homecard h1{font-size:54px}}

/* ---------- fichiers ---------- */
.files{display:grid;grid-template-columns:minmax(220px,280px) 1fr;gap:30px;align-items:start}
@media (max-width:950px){.files{grid-template-columns:1fr}}
.tree{padding:28px 14px 24px 36px;display:flex;flex-direction:column;gap:3px}
.tclient{font-family:var(--fd);font-weight:700;font-size:24px;text-transform:uppercase;color:var(--brick);margin-top:12px}
.tproj{display:flex;justify-content:space-between;gap:8px;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:15.5px}
.tproj:hover{background:rgba(253,177,37,.25)} .tproj.on{background:var(--mustard);font-weight:600}
.tproj small{color:var(--muted)}
.fscore{margin-left:auto;padding:12px 18px;transform:rotate(1deg);font-size:15px}
.fscore b{font-family:var(--fd);font-weight:700;font-size:36px;color:var(--brick);margin-right:8px}
.fhead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.fpath{font-family:var(--fd);font-weight:700;font-size:34px;text-transform:uppercase;color:var(--brick);line-height:1}
.fclient{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--brick)}
.fclient input{padding:8px 11px;border:1.5px solid var(--line);border-radius:7px;background:#fffdf8;font-size:16px;text-transform:none;letter-spacing:0;color:var(--ink)}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:30px 22px}
.folder{position:relative;padding-top:34px}
.ftab{position:absolute;top:0;left:0;background:var(--kraft) center/600px;padding:8px 20px 12px;border-radius:12px 12px 0 0;font-weight:600;font-size:14.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--brick)}
.ftab small{color:var(--ink);margin-left:6px;letter-spacing:0}
.fbody{position:relative;background:var(--kraft) center/800px;border-radius:0 12px 12px 12px;padding:16px;box-shadow:0 8px 18px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:10px;min-height:210px}
.pv{display:grid;place-items:center;min-height:200px;max-height:70vh;border-radius:8px;overflow:hidden;
  background:repeating-conic-gradient(#efe6d6 0 25%,#fbf6ec 0 50%) 0 0/20px 20px;box-shadow:inset 0 0 0 1px var(--line)}
.pv img{max-width:100%;max-height:70vh;object-fit:contain;display:block}
.pv iframe{width:100%;height:70vh;border:0;background:#fff}
.fline [data-fa=view],.file [data-fa=view]{cursor:zoom-in}
.fline .n[data-fa=view]:hover,.file .n[data-fa=view]:hover{text-decoration:underline}
.pfgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:640px){.pfgrid{grid-template-columns:repeat(2,1fr)}}
.pf{display:flex;flex-direction:column;align-items:flex-start;gap:4px;border:0;cursor:pointer;background:var(--kraft) center/500px;border-radius:4px 10px 10px 10px;padding:10px 12px;
  font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--brick);box-shadow:0 3px 8px rgba(0,0,0,.18);transition:transform .12s}
.pf b{font-family:var(--fd);font-size:30px;color:var(--ink);letter-spacing:0;line-height:1}
.pf:hover{transform:translateY(-2px)}
.pfchips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:1px solid rgba(59,33,22,.3);background:rgba(255,255,255,.65);border-radius:99px;padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.fchip b{color:var(--brick)}
.fchip:hover{background:var(--cream);border-color:var(--brick)}
.folder.flash .fbody{animation:flash 1.5s}
@keyframes flash{0%,60%{box-shadow:0 0 0 5px var(--brick),0 8px 18px rgba(0,0,0,.25)}}
.side{display:flex;flex-direction:column;gap:34px}
.newf{margin-top:14px;align-self:flex-start}
.must{display:inline-block;color:#fff;background:var(--brick);padding:2px 7px 1px;border-radius:3px;margin-left:8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;vertical-align:2px}
/* étiquette « guide de nommage » : forme d'étiquette à bagage, accrochée par une ficelle */
.guide{position:relative;background:var(--creme) center/600px;padding:26px 20px 20px 26px;border-radius:6px 6px 6px 6px;box-shadow:0 8px 18px rgba(0,0,0,.25);transform:rotate(-1deg);font-size:14.5px;
  clip-path:polygon(0 22px,22px 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%)}
.guide::before{content:'';position:absolute;top:12px;left:calc(50% - 7px);width:14px;height:14px;border-radius:50%;background:#7a5a3a;box-shadow:inset 0 2px 3px rgba(0,0,0,.5)}
.guide .kicker{margin:10px 0 10px;text-align:center}
.guide ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:10px}
.guide code{background:var(--mustard);padding:2px 7px;border-radius:4px;font-size:13.5px;font-weight:600}
.guide small{color:var(--muted)}

<div id="app">
  <div id="top"><div id="brand"></div><div class="row"><span id="syncdot" title="État de la synchronisation"></span><div class="tools" id="tools"></div></div></div>
  <nav id="tabs"></nav>

</div>
<div id="home"></div>
<dialog id="dlg"></dialog>

<dialog id="vdlg" style="width:min(1100px,96vw)"></dialog>
<dialog id="cdlg" style="width:min(480px,92vw)"></dialog>

<input type="file" id="fileIn" multiple hidden>

<script src="assets/vendor/supabase.js"></script>
<script>
const DAYS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi'];
const STATUS={todo:'À faire',doing:'En cours',review:'À valider',done:'Terminé'};
const VSTATUS={pending:'⏳ À valider',ok:'✅ Validé',fix:'✏️ À corriger'};
const KEY='suivi-stagiaires.v2', OLD_KEY='suivi-stagiaires.v1';
const rot=i=>`--r:${[-.6,.4,-.3,.5,-.4,.2][i%6]}deg`;   // petite inclinaison « posé à la main »

/* ---------- état ---------- */
// store = tous les profils (+ code tuteur) ; state = données du profil ouvert ; tutor = mode tuteur actif
let store={profiles:[]};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.profiles))store=s}catch(e){}
// « Ma semaine » du tuteur : ses propres tâches, synchronisées sous le profil technique ME_ID (jamais listé comme stagiaire)
const ME_ID='_tuteur';
store.tutorData=store.tutorData||{tasks:[],projects:[]};
let state={tasks:[],projects:[]}, profile=null, tutor=false, view='home';
let syncHook=null;   // branché par le module de synchronisation : chaque enregistrement part aussi en ligne
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){notify("Impossible d'enregistrer : espace de stockage du navigateur indisponible.")}if(syncHook)syncHook()};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// simple empreinte du code (dissuasif : les données restent lisibles dans le navigateur)
const hash=(salt,pin)=>{let h=5381;for(const c of salt+':'+pin)h=(h*33+c.charCodeAt(0))|0;return 'h'+(h>>>0).toString(36)};
const ss={get:k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}}};

/* ---------- dates (locales, format YYYY-MM-DD) ---------- */
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const today=()=>iso(new Date());
const mondayOf=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
const fmt=(s,o={day:'numeric',month:'short'})=>parse(s).toLocaleDateString('fr-FR',o);
const fmtL=s=>fmt(s,{day:'numeric',month:'long',year:'numeric'});
const dayName=s=>parse(s).toLocaleDateString('fr-FR',{weekday:'long'});
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const isWE=s=>[0,6].includes(parse(s).getDay());
const prevWd=s=>{let d=addDays(s,-1);while(isWE(d))d=addDays(d,-1);return d};
function workdays(a,b){let n=0;for(let d=a;d<=b;d=addDays(d,1))if(!isWE(d))n++;return n}
function stageInfo(pr){
  const t=today(), total=Math.max(1,workdays(pr.start,pr.end));
  const done=t<pr.start?0:workdays(pr.start,t<pr.end?t:pr.end);
  return {total,done,left:total-done,pct:done/total*100,before:t<pr.start,after:t>pr.end};
}

// samedi / dimanche → lundi suivant
const workday=d=>{const w=parse(d).getDay();return w===6?addDays(d,2):w===0?addDays(d,1):d};
// n tâches réparties sur les jours ouvrés d'aujourd'hui à la deadline (toutes aujourd'hui sans deadline)
function spreadDays(n,deadline){
  const days=[]; let d=workday(today());
  if(deadline&&deadline>d)for(;d<=deadline&&days.length<60;d=workday(addDays(d,1)))days.push(d);
  if(!days.length)days.push(workday(today()));
  return Array.from({length:n},(_,i)=>days[Math.floor(i*days.length/n)]);
}

/* ---------- report automatique des tâches non terminées ---------- */
function rollover(d=state){
  let target=today();
  if(parse(target).getDay()===6)target=addDays(target,2); else if(parse(target).getDay()===0)target=addDays(target,1);
  let changed=false;
  for(const t of d.tasks||[]) if(!t.done&&t.date<target){ if(!t.from)t.from=t.date; t.date=target; changed=true; }
  if(changed)save();
}

/* ---------- IndexedDB pour les rendus ---------- */
const db=new Promise((res,rej)=>{
  const r=indexedDB.open('suivi-stagiaires',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'}).createIndex('project','projectId');
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
});
db.catch(()=>{});
const tx=async(mode,fn)=>{const d=await db;return new Promise((res,rej)=>{const t=d.transaction('files',mode);const r=fn(t.objectStore('files'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})};
const filesOf=pid=>tx('readonly',s=>s.index('project').getAll(pid)).catch(()=>[]);
const allFiles=()=>tx('readonly',s=>s.getAll()).catch(()=>[]);
const rawGet=id=>tx('readonly',s=>s.get(id));
const rawPut=f=>tx('readwrite',s=>s.put(f));
const rawDel=id=>tx('readwrite',s=>s.delete(id));
// toute écriture de fichier part aussi en ligne (fiche + contenu)
const putFile=f=>rawPut(f).then(()=>Sync.queueFile('put',f.id));
const delFile=async id=>{
  const f=await rawGet(id).catch(()=>null); await rawDel(id);
  if(f?.drive)window.desktop?.files?.remove(f.rel);   // Google Drive : le fichier part à la corbeille (récupérable)
  Sync.queueFile('del',id,f?.drive?(f.preview||'drive:'+f.rel):f?.path);   // Drive : on retire aussi l'aperçu allégé
};

/* ---------- synchronisation en ligne (Supabase) ---------- */
// Tout reste enregistré sur le poste (localStorage + IndexedDB), l'appli marche donc sans internet.
// Dès que la connexion est là, les changements partent vers Supabase et ceux des autres postes arrivent en direct.
// Les données sont découpées en lignes (fiche profil, joueur, chaque tâche, chaque projet) pour que deux personnes
// qui modifient des éléments différents en même temps ne s'écrasent pas.
const SYNC={url:'https://vufonmmhzqkmrbxzbvcg.supabase.co',key:'sb_publishable_0WOyoJjyFSef24p1VPPttA_oQu7iPyB'};
const Sync=(()=>{
  const sb=window.supabase?.createClient?window.supabase.createClient(SYNC.url,SYNC.key,{auth:{persistSession:false}}):null;
  const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
  // texte canonique (clés triées) : la base range les champs dans son propre ordre, il faut comparer le contenu, pas l'ordre
  const canon=v=>JSON.stringify(v,(k,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.keys(x).sort().reduce((o,key)=>(o[key]=x[key],o),{}):x);
  // shadow : dernière version connue du serveur pour chaque ligne · meta : curseurs, file d'attente des fichiers
  let shadow=load('suivi-sync-shadow2',{}), meta=load('suivi-sync-meta',{});
  meta.device=meta.device||uid(); meta.fileQueue=meta.fileQueue||[];
  if(!Object.keys(shadow).length)meta.since=null;   // pas d'historique sur ce poste : on relit tout depuis le début
  const keep=()=>{try{localStorage.setItem('suivi-sync-shadow2',JSON.stringify(shadow));localStorage.setItem('suivi-sync-meta',JSON.stringify(meta))}catch(e){}};
  let timer=null, busy=false, again=false, status=sb?'connexion…':'hors ligne', listeners=[];
  const setStatus=s=>{status=s;listeners.forEach(f=>f(s))};

  // ---- données ----
  function explode(){
    const m={};
    for(const pr of store.profiles){
      const {data,...info}=pr;
      m['profile:'+pr.id]={profile_id:pr.id,kind:'profile',doc:info};
      if(data?.player)m['player:'+pr.id]={profile_id:pr.id,kind:'player',doc:data.player};
      for(const t of data?.tasks||[])m['task:'+t.id]={profile_id:pr.id,kind:'task',doc:t};
      for(const p of data?.projects||[])m['project:'+p.id]={profile_id:pr.id,kind:'project',doc:p};
    }
    for(const t of store.tutorData?.tasks||[])m['task:'+t.id]={profile_id:ME_ID,kind:'task',doc:t};
    return m;
  }
  const replaceKeep=(target,src,keepKeys=[])=>{
    for(const k of Object.keys(target))if(!(k in src)&&!keepKeys.includes(k))delete target[k];
    Object.assign(target,src);
  };
  function applyRow(r){
    const oid=r.id.slice(r.id.indexOf(':')+1);
    if(r.profile_id===ME_ID){   // tâches du tuteur
      if(r.kind!=='task')return;
      const arr=store.tutorData.tasks, i=arr.findIndex(x=>x.id===oid);
      if(r.deleted){if(i>=0)arr.splice(i,1)} else if(i>=0)replaceKeep(arr[i],r.doc); else arr.push(r.doc);
      return;
    }
    let pr=store.profiles.find(x=>x.id===r.profile_id);
    if(r.kind==='profile'){
      if(r.deleted){store.profiles=store.profiles.filter(x=>x.id!==r.profile_id);if(profile?.id===r.profile_id)setTimeout(logout);return}
      if(pr)replaceKeep(pr,r.doc,['data']); else store.profiles.push({...r.doc,data:{tasks:[],projects:[]}});
      return;
    }
    if(!pr){ // la fiche profil n'est pas encore arrivée : on prépare une place
      if(r.deleted)return;
      pr={id:r.profile_id,first:'…',last:'',start:today(),end:today(),data:{tasks:[],projects:[]}}; store.profiles.push(pr);
    }
    const d=pr.data=pr.data||{tasks:[],projects:[]};
    if(r.kind==='player'){if(!r.deleted){if(d.player)replaceKeep(d.player,r.doc);else d.player=r.doc}return}
    const arr=r.kind==='task'?(d.tasks=d.tasks||[]):(d.projects=d.projects||[]);
    const i=arr.findIndex(x=>x.id===oid);
    if(r.deleted){if(i>=0)arr.splice(i,1)} else if(i>=0)replaceKeep(arr[i],r.doc); else arr.push(r.doc);
  }
  // applique des lignes reçues : une modification locale pas encore envoyée garde la priorité
  function applyRows(rows){
    if(!rows.length)return false;
    const cur=explode(); let changed=false;
    for(const r of rows){
      if(r.updated_at&&(!meta.since||r.updated_at>meta.since))meta.since=r.updated_at;
      const local=cur[r.id], localS=local?canon(local.doc):undefined, remoteS=canon(r.doc);
      // en attente = modifié sur ce poste depuis la dernière synchro ; sans historique, c'est la version en ligne qui fait foi
      const pending=localS!==undefined&&!!shadow[r.id]&&shadow[r.id].s!==localS;
      if(pending)continue;
      if(r.deleted){delete shadow[r.id]; if(local){applyRow(r);changed=true}; continue}
      shadow[r.id]={s:remoteS,p:r.profile_id,k:r.kind};
      if(localS!==remoteS){applyRow(r);changed=true}
    }
    keep();
    if(changed){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){} refreshUI()}
    return changed;
  }
  function applySettings(rows){
    for(const r of rows){
      if(r.id.startsWith('presence:')){onPresence(r.id.slice(9),r.doc);continue}
      if(r.id==='tutor'&&meta.tutorSent===store.tutorPin&&r.doc?.pin&&r.doc.pin!==store.tutorPin){
        store.tutorPin=meta.tutorSent=r.doc.pin; keep(); try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}
      }
    }
  }
  async function pull(){
    if(!sb)return;
    for(;;){ // par paquets de 1000, dans l'ordre chronologique
      let q=sb.from('items').select('*').order('updated_at').limit(1000);
      if(meta.since)q=q.gt('updated_at',meta.since);
      const {data,error}=await q; if(error)throw error;
      applyRows(data); if(data.length<1000)break;
    }
    const st=await sb.from('settings').select('*'); if(!st.error)applySettings(st.data);
    await pullFiles();
  }
  async function push(){
    if(!sb)return;
    const cur=explode(), rows=[];
    for(const [id,r] of Object.entries(cur)){
      const s=canon(r.doc);
      if(shadow[id]?.s!==s)rows.push({id,profile_id:r.profile_id,kind:r.kind,doc:r.doc,deleted:false,updated_by:meta.device});
    }
    for(const [id,sh] of Object.entries(shadow))
      if(!cur[id])rows.push({id,profile_id:sh.p,kind:sh.k,doc:{},deleted:true,updated_by:meta.device});
    for(let i=0;i<rows.length;i+=400){
      const chunk=rows.slice(i,i+400);
      const {error}=await sb.from('items').upsert(chunk); if(error)throw error;
      for(const r of chunk){if(r.deleted)delete shadow[r.id]; else shadow[r.id]={s:canon(r.doc),p:r.profile_id,k:r.kind}}
      keep();
    }
    if(store.tutorPin&&meta.tutorSent!==store.tutorPin){
      const {error}=await sb.from('settings').upsert({id:'tutor',doc:{pin:store.tutorPin}}); if(error)throw error;
      meta.tutorSent=store.tutorPin; keep();
    }
  }

  // ---- fichiers ----
  const pathOf=f=>{const pr=store.profiles.find(x=>x.data?.projects?.some(p=>p.id===f.projectId));return pr?`${pr.id}/${f.projectId}/${f.id}`:null};
  const strip=f=>{const {blob,uploaded,path,pvBlob,...m}=f;return m};
  function queueFile(op,id,path){
    meta.fileQueue=meta.fileQueue.filter(q=>q.id!==id); meta.fileQueue.push({op,id,path}); keep(); schedule();
  }
  async function flushFiles(){
    while(meta.fileQueue.length){
      const q=meta.fileQueue[0];
      if(q.op==='put'){
        const f=await rawGet(q.id).catch(()=>null);
        const pr=f&&(pathOf(f)||'').split('/')[0];
        // fichier rangé dans le Google Drive de l'agence : seule sa fiche part sur Supabase
        const path=f&&(f.drive?'drive:'+f.rel:(f.path||pathOf(f)));
        if(f&&pr&&path){
          if(f.drive&&f.pvBlob){   // aperçu allégé pour le téléphone
            const pp=`${pr}/previews/${f.id}.jpg`;
            const {error}=await sb.storage.from('files').upload(pp,f.pvBlob,{upsert:true,contentType:'image/jpeg'});
            if(error)throw error;
            f.preview=pp; delete f.pvBlob; await rawPut(f);
          }
          if(!f.drive&&f.blob&&!f.uploaded){
            const {error}=await sb.storage.from('files').upload(path,f.blob,{upsert:true,contentType:f.type||'application/octet-stream'});
            if(error)throw error;
          }
          const {error}=await sb.from('files').upsert({id:f.id,profile_id:pr,project_id:f.projectId,meta:strip(f),path,deleted:false});
          if(error)throw error;
          if(!f.drive&&(!f.uploaded||!f.path)){f.uploaded=true;f.path=path;await rawPut(f)}
        }
      }else{
        await sb.from('files').update({deleted:true}).eq('id',q.id);
        if(q.path&&!q.path.startsWith('drive:'))await sb.storage.from('files').remove([q.path]);
      }
      meta.fileQueue.shift(); keep();
    }
  }
  async function applyFiles(rows){
    let changed=false;
    for(const r of rows){
      if(r.updated_at&&(!meta.fsince||r.updated_at>meta.fsince))meta.fsince=r.updated_at;
      if(meta.fileQueue.some(q=>q.id===r.id))continue;      // modification locale en attente : prioritaire
      const local=await rawGet(r.id).catch(()=>null);
      if(r.deleted){if(local){await rawDel(r.id);changed=true}continue}
      if(local&&canon(strip(local))===canon(r.meta))continue;
      await rawPut({...r.meta,blob:local?.blob||null,uploaded:true,path:r.path}); changed=true;
    }
    keep();
    if(changed){await refreshCounts();refreshUI()}
  }
  async function pullFiles(){
    for(;;){
      let q=sb.from('files').select('*').order('updated_at').limit(1000);
      if(meta.fsince)q=q.gt('updated_at',meta.fsince);
      const {data,error}=await q; if(error)throw error;
      await applyFiles(data); if(data.length<1000)break;
    }
  }
  // contenu d'un fichier venu d'un autre poste : téléchargé à la demande, puis gardé sur le poste
  const driveCache=new Map();
  async function blobOf(f){
    if(f.blob)return f.blob;
    if(f.drive){   // rangé dans le Google Drive : lu sur le disque de ce poste (appli installée uniquement)
      if(!window.desktop?.files){   // ailleurs (téléphone, navigateur) : l'aperçu allégé
        if(!sb||!f.preview)return null;
        const k='pv:'+f.id; if(driveCache.has(k))return driveCache.get(k);
        const {data,error}=await sb.storage.from('files').download(f.preview); if(error||!data)return null;
        driveCache.set(k,data); return data;
      }
      if(driveCache.has(f.rel))return driveCache.get(f.rel);
      const buf=await window.desktop.files.read(f.rel); if(!buf)return null;
      const b=new Blob([buf],{type:f.type||''}); driveCache.set(f.rel,b); return b;
    }
    if(!sb||!f.path)return null;
    const {data,error}=await sb.storage.from('files').download(f.path); if(error)return null;
    f.blob=data; await rawPut(f); return data;
  }

  // ---- cycle ----
  function refreshUI(){
    if(view==='app'&&!dlg.open){renderHUD();render()}
    else if(view==='admin'&&!dlg.open){renderChrome();render()}
    else if(view==='home'&&home.querySelector('.profiles'))renderHome('login');
    pushWidget();
  }
  function schedule(){if(!sb)return;clearTimeout(timer);timer=setTimeout(flush,700)}
  async function flush(){
    if(!sb)return; if(busy){again=true;return} busy=true;
    try{await push();await flushFiles();setStatus('synchronisé')}
    catch(e){setStatus('hors ligne')}
    finally{busy=false;if(again){again=false;schedule()}}
  }
  async function start(){
    if(!sb)return;
    syncHook=schedule;
    // au démarrage, on revérifie toute la liste des fichiers (quelques Ko) : une fiche perdue sur ce poste revient toute seule
    meta.fsince=null;
    try{await pull();await flush()}catch(e){setStatus('hors ligne')}
    sb.channel('suivi')
      .on('postgres_changes',{event:'*',schema:'public',table:'items'},p=>p.new?.id&&applyRows([p.new]))
      .on('postgres_changes',{event:'*',schema:'public',table:'files'},p=>p.new?.id&&applyFiles([p.new]))
      .on('postgres_changes',{event:'*',schema:'public',table:'settings'},p=>p.new?.id&&applySettings([p.new]))
      .subscribe(s=>{if(s==='SUBSCRIBED')setStatus('synchronisé');else if(s==='CHANNEL_ERROR'||s==='TIMED_OUT'||s==='CLOSED')setStatus('hors ligne')});
    setInterval(async()=>{try{await pull();await flush()}catch(e){setStatus('hors ligne')}},60000);   // rattrapage régulier
    addEventListener('online',()=>{pull().then(flush).catch(()=>{})});
    addEventListener('offline',()=>setStatus('hors ligne'));
  }
  // présence d'un stagiaire (inactif / de retour) : écrite directement, hors file d'attente, pour arriver en quelques secondes
  async function setPresence(pid,doc){if(sb)try{await sb.from('settings').upsert({id:'presence:'+pid,doc})}catch(e){}}
  return {start,schedule,queueFile,blobOf,setPresence,cachedBlob:f=>f.blob||(f.drive?driveCache.get(window.desktop?.files?f.rel:'pv:'+f.id):null),onStatus:f=>{listeners.push(f);f(status)},get enabled(){return !!sb}};
})();

function migrateSteps(d){

    const day=p.created>1e12?iso(new Date(p.created)):today();
    for(const s of p.steps){

}

const RULES={src:'NomClient-NomProjet',img:'NomClient-TypeImage',mock:'NomClient-NomProjet-Mockup',bat:'AAMMJJ-NOMCLIENT-Projet',other:'NomClient-Description'};
const IMG_EXT=['jpg','jpeg','png','webp','gif','tif','tiff','heic','svg'];
// règles souples (un minimum de logique suffit), sauf pour les BAT qui doivent respecter AAMMJJ-NOMCLIENT-Projet
function checkName(name,key,p){
  const ck=norm(p.client); if(!ck)return {state:'noclient'};
  const [base,ext]=splitExt(name), e=ext.toLowerCase();
  const parts=base.split(/[-_\s'’.]+/).filter(Boolean), rest=parts.slice(1).map(norm);
  const pWords=noAccent(p.name).split(/[^a-zA-Z0-9]+/).map(norm).filter(w=>w.length>=3);
  const matchProject=s=>pWords.some(w=>looseEq(s,w))||looseEq(s,norm(p.name));
  const hasClient=parts.length>1&&looseEq(norm(parts[0]),ck);
  const hasProject=rest.some(matchProject);
  const descriptive=rest.some(r=>/[a-z]{3}/.test(r)&&!GENERIC.test(r));
  if(key==='bat'){
    const m=base.match(/^(\d{2})(\d{2})(\d{2})-([A-Z0-9]+)-(\S+)$/), dateOk=!!m&&+m[2]>=1&&+m[2]<=12&&+m[3]>=1&&+m[3]<=31;
    const ok=dateOk&&m[4]===ck.toUpperCase()&&matchProject(norm(m[5]));
    return {state:ok?'ok':'bad',strict:true,rule:RULES.bat};
  }
  if(key==='mockups'||(key!=='sources'&&/mockup/i.test(base)))
    return {state:hasClient&&hasProject&&/mockup/i.test(base)?'ok':'bad',rule:RULES.mock};
  if(key==='sources'||SRC_EXT.includes(e))
    return {state:hasClient&&hasProject?'ok':'bad',rule:RULES.src};
  // images, recherches, livrables : le client puis un mot qui décrit le fichier
  return {state:hasClient&&descriptive?'ok':'bad',rule:IMG_EXT.includes(e)?RULES.img:RULES.other};
}

  return `<span class="chip badc">⚠ À renommer${r.strict?' · format obligatoire':''}</span>
    <span class="sugg">Règle : <code>${r.rule}</code></span>`;
}

// XP une seule fois par fichier
async function rewardFile(f,p){
  if(f.rewarded)return;
  const r=checkName(f.name,folderOf(f),p), pl=state.player;
  if(r.state==='noclient')return;
  if(r.state!=='ok'){pl.nameStreak=0;save();return}
  f.rewarded=true; await putFile(f);
  pl.filesOk++; pl.nameStreak++; pl.bestNameStreak=Math.max(pl.bestNameStreak,pl.nameStreak);
  const t=today(); if(pl.fileXP?.date!==t)pl.fileXP={date:t,xp:0};
  const xp=Math.min(folderOf(f)==='bat'?XP_BAT:XP_FILE,FILE_XP_CAP-pl.fileXP.xp);
  if(xp>0){pl.fileXP.xp+=xp;grant(xp,folderOf(f)==='bat'?'BAT bien nommé':'Fichier bien nommé')}
  else{toast("🏷️ Bien nommé ! (plafond d'XP fichiers du jour atteint)");checkTrophies();save()}
}

let pdfjsP=null;
const loadPdfJs=()=>pdfjsP||(pdfjsP=new Promise((res,rej)=>{
  const s=document.createElement('script'); s.src='assets/vendor/pdf.min.js';
  s.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc='assets/vendor/pdf.worker.min.js';res(window.pdfjsLib)}; s.onerror=rej;

async function makePreview(file){
  const MAX=1400, e=splitExt(file.name)[1].toLowerCase(), cv=document.createElement('canvas'), c=cv.getContext('2d');
  const paint=(w,h)=>{cv.width=Math.max(1,Math.round(w));cv.height=Math.max(1,Math.round(h));c.fillStyle='#fff';c.fillRect(0,0,cv.width,cv.height)};
  try{
    if(e==='pdf'||e==='ai'||file.type==='application/pdf'){   // 1re page (un .ai doit être « compatible PDF »)
      const pdfjs=await loadPdfJs(), doc=await pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
      const page=await doc.getPage(1), v1=page.getViewport({scale:1}), vp=page.getViewport({scale:MAX/Math.max(v1.width,v1.height)});
      paint(vp.width,vp.height); await page.render({canvasContext:c,viewport:vp}).promise; doc.destroy();
    }else if(/^image\//.test(file.type)||IMG_EXT.includes(e)){
      const bmp=await createImageBitmap(file), s=Math.min(1,MAX/Math.max(bmp.width,bmp.height));
      paint(bmp.width*s,bmp.height*s); c.drawImage(bmp,0,0,cv.width,cv.height);
    }else return null;
    return await new Promise(r=>cv.toBlob(r,'image/jpeg',.72));
  }catch(err){return null}   // format illisible (psd, ai non compatible PDF…) : pas d'aperçu
}
async function addToFolder(p,key,list){
  if(!list.length)return;
  const W=driveFiles();
  if(W&&!(await W.root()))return notify("Le dossier Google Drive où ranger les fichiers n'est pas encore choisi sur cet ordinateur. Onglet Fichiers › « Choisir le dossier Google Drive » (code tuteur).");
  let v;
  if(key==='livrables'){ // chaque dépôt dans Livrables crée une nouvelle version à valider
    p.versions=p.versions||{}; const ks=Object.keys(p.versions).map(Number);
    v=(ks.length?Math.max(...ks):0)+1; p.versions[v]={label:'V'+v,date:today(),status:'pending',comment:''};
  }
  try{for(const file of list){
    const f={id:uid(),projectId:p.id,folder:key,v,name:file.name,type:file.type,size:file.size,blob:file,added:Date.now()};
    if(W){   // appli installée : le fichier va dans le Google Drive, pas sur Supabase
      const rel=await W.write(`${driveDir(p,key)}/${safeName(file.name)}`,await file.arrayBuffer());
      Object.assign(f,{drive:true,rel,name:rel.split('/').pop(),blob:null});
      const pv=await makePreview(file); if(pv)f.pvBlob=pv;
    }
    await putFile(f); await rewardFile(f,p);
  }}catch(err){notify(W?"Impossible d'écrire le fichier dans le dossier Google Drive : vérifie que Google Drive est bien lancé sur cet ordinateur.\n("+err.message+")"
    :"Impossible d'enregistrer le fichier : ouvre l'application dans Chrome ou Edge (stockage du navigateur indisponible ici).");return}
  save(); await checkFolderDone(p); await refreshCounts();
}

function askName(base,ext,check){
  return new Promise(res=>{
    const d=$('#rdlg'); let done=false; const end=v=>{if(done)return;done=true;res(v);if(d.open)d.close()};
    d.innerHTML=`<form class="dlg"><h2 class="title">Renommer</h2>

      ${check&&check.rule?`<div class="hint">Règle pour ce fichier : <code>${check.rule}</code>${check.strict?' · <b>format obligatoire</b>':''}</div>`:''}
      <div class="row between"><button type="button" class="btn" data-x>Annuler</button><button class="btn primary">Renommer</button></div></form>`;
    d.showModal(); const i=d.querySelector('input'); i.focus(); i.select();
    d.querySelector('form').onsubmit=e=>{e.preventDefault();end(i.value.trim()||null)};
    d.querySelector('[data-x]').onclick=()=>end(null);
    d.onclose=()=>end(null);
  });

async function renameFile(fid,p){
  const f=(await filesOf(p.id)).find(x=>x.id===fid); if(!f)return;
  const [base,ext]=splitExt(f.name);
  if(f.drive&&!driveFiles())return notify("Ce fichier est rangé dans le Google Drive de l'agence : renomme-le depuis l'appli installée.");
  let n=await askName(base,ext,checkName(f.name,folderOf(f),p)); if(!n)return;
  if(ext&&!n.toLowerCase().endsWith('.'+ext.toLowerCase()))n+='.'+ext;
  if(f.drive){   // on renomme aussi le vrai fichier dans le dossier
    const dir=f.rel.split('/').slice(0,-1).join('/');
    const nr=await driveFiles().rename(f.rel,`${dir}/${safeName(n)}`);
    if(!nr)return notify("Fichier introuvable dans le dossier Google Drive de ce poste (synchronisation en cours ?).");
    f.rel=nr; n=nr.split('/').pop();
  }
  f.name=n; await putFile(f); await rewardFile(f,p);
  await checkFolderDone(p); save();
}
// aperçu d'un fichier sans le télécharger (images, PDF, et .ai enregistrés « compatibles PDF »)
async function openPreview(f,p,after){
  const d=$('#vdlg'), e=splitExt(f.name)[1].toLowerCase();
  const W=f.drive&&driveFiles(), pvOnly=f.drive&&!W;   // pvOnly : téléphone / navigateur → aperçu allégé (JPEG)
  const img=pvOnly||/^image\//.test(f.type)||IMG_EXT.includes(e), pdf=!pvOnly&&(f.type==='application/pdf'||e==='pdf'||e==='ai');
  const blob=await Sync.blobOf(f);   // fichier déposé depuis un autre poste : téléchargé à la première ouverture
  if(!blob)return notify(f.drive?(W?"Fichier introuvable dans le dossier Google Drive de ce poste : Google Drive est peut-être encore en train de le synchroniser."
    :"Pas d'aperçu pour ce fichier : il est rangé dans le Google Drive de l'agence, ouvre-le depuis l'appli installée ou directement dans le Drive.")
    :"Ce fichier n'est pas encore disponible sur ce poste (pas de connexion ?). Réessaie dans un instant.");
  const url=URL.createObjectURL(pdf?new Blob([blob],{type:'application/pdf'}):blob);
  d.innerHTML=`<div class="dlg">
    <div class="row between" style="flex-wrap:nowrap;align-items:flex-start"><h2 style="margin:0;font-size:22px;font-weight:600;word-break:break-all">${esc(f.name)}</h2><button class="x" data-x title="Fermer">×</button></div>
    <div class="fstat">${nameTag(f,p)}</div>
    <div class="pv">${img?`<img src="${url}" alt="">`:pdf?`<iframe src="${url}" title="Aperçu"></iframe>`
      :`<div class="empty">Pas d'aperçu possible pour ce format (.${esc(e||'?')}). ${W?'Clique sur « Ouvrir » pour le lancer dans son logiciel.':'Télécharge le fichier pour l\'ouvrir.'}</div>`}</div>
    ${pvOnly?`<div class="hint">Aperçu allégé${/pdf|ai/.test(e)?' (1re page)':''} · l'original est dans le Google Drive de l'agence.</div>`
      :e==='ai'?'<div class="hint">L\'aperçu d\'un .ai ne fonctionne que s\'il a été enregistré avec l\'option « Créer un fichier compatible PDF ».</div>':''}
    <div class="row between">${pvOnly?'<span></span>':'<button class="btn" data-ren>✏️ Renommer</button>'}
      <div class="row">${pvOnly?'':W?'<button class="btn" data-dv="reveal">📂 Voir dans le dossier</button><button class="btn" data-dv="open">↗ Ouvrir</button>'
        :`<a class="btn" href="${url}" download="${esc(f.name)}" style="text-decoration:none">⬇ Télécharger</a>`}<button class="btn primary" data-x>Fermer</button></div></div></div>`;
  d.showModal();
  d.onclose=()=>URL.revokeObjectURL(url);
  d.onclick=ev=>{if(ev.target===d)d.close()};
  d.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>d.close());
  const rb=d.querySelector('[data-ren]'); if(rb)rb.onclick=async()=>{d.close();await renameFile(f.id,p);after&&after()};
  d.querySelectorAll('[data-dv]').forEach(b=>b.onclick=()=>W[b.dataset.dv](f.rel));
}

  for(let i=0;i<5;i++){
    const d=addDays(ws,i);
    const tasks=state.tasks.filter(x=>x.date===d).sort((a,b)=>a.done-b.done||rank[a.prio]-rank[b.prio]||a.created-b.created);
    const nd=tasks.filter(x=>x.done).length;
    const flags=state.projects.filter(p=>p.deadline===d&&p.status!=='done');
    h+=`<section class="day lined ${d===t?'today':''} ${d===ui.mday?'msel':''}" data-day="${d}" style="${rot(i)}">
      ${d===t?'<span class="tape"></span>':''}
      <div class="dayhead"><h3 class="title">${DAYS[i]}</h3><span class="hand">${d===t?'aujourd\'hui !':fmt(d)}</span></div>
      <div class="prog"><i style="width:${tasks.length?nd/tasks.length*100:0}%"></i></div>
      ${flags.map(p=>`<span class="chip flag" data-a="openproj" data-pid="${p.id}" style="cursor:pointer">🚩 Deadline : ${esc(p.name)}</span>`).join('')}
      ${d===profile?.end?'<span class="chip grad">🎓 Dernier jour de stage</span>':''}
      ${tasks.map(taskHTML).join('')||'<div class="empty">Rien de prévu</div>'}
      <form class="add" data-date="${d}">
        <input type="text" placeholder="+ ajouter une tâche" required>
        ${me?'':`<select title="Projet">${projOptions('')}</select>`}
      </form>
    </section>`;
  }
  main.innerHTML=h+'</div>'+(me?'':calendarHTML())+'<p class="tip">Astuce : glisse une tâche d\'un jour à l\'autre pour la déplacer · clique sur ⚑ pour changer sa priorité.</p>';
}

/* calendrier mensuel : jours de deadline en couleur (rouge = en retard/aujourd'hui, jaune = à venir, vert = terminé) */
function calendarHTML(){
  const t=today(), first=ui.calMonth||(ui.calMonth=t.slice(0,8)+'01'), fd=parse(first);
  const lead=(fd.getDay()+6)%7, n=new Date(fd.getFullYear(),fd.getMonth()+1,0).getDate();
  const wk=[0,1,2,3,4,5,6].map(i=>addDays(ui.weekStart,i));
  const byDay={}; state.projects.filter(p=>p.deadline).forEach(p=>(byDay[p.deadline]=byDay[p.deadline]||[]).push(p));
  let cells=['L','M','M','J','V','S','D'].map(d=>`<div class="dh">${d}</div>`).join('');
  for(let i=0;i<lead;i++)cells+='<div></div>';
  for(let d=1;d<=n;d++){
    const ds=iso(new Date(fd.getFullYear(),fd.getMonth(),d)), ps=byDay[ds]||[];
    let cls='c'+(isWE(ds)?' we':'')+(wk.includes(ds)?' wk':'')+(ds===t?' td':'');
    const tips=[];
    if(ps.length){
      const open=ps.filter(p=>p.status!=='done');
      cls+=' dl'+(!open.length?' ok':ds>t?' soon':'');
      tips.push(...ps.map(p=>p.name+(p.status==='done'?' (terminé)':'')));
    }
    if(ds===profile.end)tips.push('Fin du stage 🎓');
    cells+=`<div class="${cls}" data-a="calday" data-d="${ds}"${tips.length?` title="${esc(tips.join(' · '))}"`:''}>${d}${ps.length>1?`<i>${ps.length}</i>`:''}${ds===profile.end?'<u>🎓</u>':''}</div>`;
  }
  const up=state.projects.filter(p=>p.deadline&&p.status!=='done').sort((a,b)=>a.deadline<b.deadline?-1:1).slice(0,6);
  const list=up.length?up.map(p=>{
    const k=diffDays(p.deadline,t);
    return `<div class="dli ${k<=0?'late':''}" data-a="openproj" data-pid="${p.id}"><span class="n">🚩 ${esc(p.name)}</span>
      <small>${fmt(p.deadline)}<br>${k<0?`en retard de ${-k} j`:k===0?"aujourd'hui !":`dans ${k} j`}</small></div>`}).join('')
    :'<div class="empty" style="text-align:left">Aucune deadline à venir 🎉</div>';
  return `<div class="calbox"><span class="tape" style="left:8%;transform:rotate(-8deg)"></span><div>
    <div class="calhead"><button class="btn sm" data-a="calprev">←</button><h3 class="title">${fd.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</h3><button class="btn sm" data-a="calnext">→</button></div>
    <div class="cal">${cells}</div>
    <div class="legend"><span style="--c:var(--brick)">En retard / aujourd'hui</span><span style="--c:var(--mustard)">À venir</span><span style="--c:var(--green)">Terminé</span></div>
  </div><div class="dllist"><h3 class="title">Prochaines deadlines</h3>${list}</div></div>`;
}

function taskHTML(x){
  const p=projName(x.project);
  const pl={high:'⚑ Urgent',low:'⚑ Basse'}[x.prio]||'⚑';
  return `<div class="task ${x.done?'done':''} ${x.prio?'p-'+x.prio:''}" data-id="${x.id}" draggable="true">
    <input type="checkbox" ${x.done?'checked':''} data-a="toggle" aria-label="Terminé">
    <div style="flex:1;min-width:0"><button class="t" data-a="edit" title="Modifier la tâche">${esc(x.title)}</button>
      <div class="meta">
        <button class="prio ${x.prio||''}" data-a="prio" title="Priorité : cliquer pour changer">${pl}</button>
        ${p?`<span class="chip" data-a="openproj" data-pid="${x.project}" style="cursor:pointer">📁 ${(c=>c?`<b>${esc(c)}</b> · `:'')(state.projects.find(q=>q.id===x.project)?.client)}${esc(p)}</span>`:''}
        ${x.byTutor?'<span class="chip tut">👩‍🏫 Tuteur</span>':''}
        ${x.from&&!x.done?`<span class="chip carry">↪ reportée du ${dayName(x.from)} ${fmt(x.from)}</span>`:''}
      </div></div></div>`;

function deadlineInfo(p){
  if(!p.deadline)return null;
  const n=diffDays(p.deadline,today());
  if(p.status==='done')return{txt:fmt(p.deadline),late:false};
  if(n<0)return{txt:`${fmt(p.deadline)} · en retard de ${-n} j`,late:true};
  if(n===0)return{txt:`${fmt(p.deadline)} · aujourd'hui !`,late:true};
  return{txt:`${fmt(p.deadline)} · dans ${n} j`,late:false};
}

let fileURLs=[];
// images venues d'un autre poste : on télécharge les vignettes manquantes puis on réaffiche une fois
const fetchThumbs=new Set(), triedThumbs=new Set();
async function loadThumbs(){
  const ids=[...fetchThumbs].filter(id=>!triedThumbs.has(id)); fetchThumbs.clear(); if(!ids.length)return;
  let got=0;
  for(const id of ids){triedThumbs.add(id);const f=await rawGet(id).catch(()=>null);if(f&&await Sync.blobOf(f))got++}
  if(got&&view==='app'&&ui.tab==='files'&&!dlg.open)render();
}
function fileLine(f,p){
  // vignette seulement si l'image est déjà sur le poste (sinon icône, et téléchargement en arrière-plan)
  // hors appli installée, un fichier du Drive s'affiche via son aperçu allégé (aussi pour les PDF / .ai)
  const pvOnly=f.drive&&!driveFiles(), thumbable=/^image\//.test(f.type)||(pvOnly&&!!f.preview);
  const b=Sync.cachedBlob(f), img=thumbable&&!!b, u=img?URL.createObjectURL(b):'';
  if(u)fileURLs.push(u);
  if(thumbable&&!b)fetchThumbs.add(f.id);
  return `<div class="fline" data-fid="${f.id}" data-pid="${p.id}">
    <div class="row" style="flex-wrap:nowrap">${img?`<img class="thumb" src="${u}" alt="" data-fa="view">`:`<span class="thumb" data-fa="view">${fileIcon(f.name)}</span>`}
      <span class="n" data-fa="view" title="Aperçu de ${esc(f.name)}">${esc(f.name)}<br><small>${size(f.size)}${f.v&&p.versions?.[f.v]?' · '+esc(p.versions[f.v].label):''}</small></span>
      ${tutor?'<button class="x" data-fa="comment" title="Commenter ce fichier">💬</button>':''}${f.drive&&driveFiles()?'<button class="x" data-fa="open" title="Ouvrir avec le logiciel habituel">↗</button><button class="x" data-fa="reveal" title="Voir dans le dossier Google Drive">📂</button>':''}${pvOnly?'':'<button class="x" data-fa="ren" title="Renommer">✏️</button><button class="x" data-fa="dl" title="Télécharger">⬇</button><button class="x" data-fa="rm" title="Supprimer">×</button>'}</div>
    <div class="fstat">${nameTag(f,p)}</div>
    ${(f.comments||[]).length?`<div class="fcoms">${f.comments.map(c=>`<div class="fcom ${c.resolved?'done':''}" data-cid="${c.id}">
      <span>💬 ${esc(c.text)}<br><small>Tuteur · ${fmt(c.date)}${c.resolved?' · corrigé ✓':''}</small></span>
      ${!c.resolved&&!tutor?'<button class="btn sm" data-fa="resolve">✓ Corrigé</button>':''}${tutor?'<button class="x" data-fa="delc" title="Supprimer le commentaire">×</button>':''}</div>`).join('')}</div>`:''}</div>`;
}
