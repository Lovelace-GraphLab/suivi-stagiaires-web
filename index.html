    save(); dlg.close();};
  dlg.querySelector('[data-a=deltask]').onclick=async()=>{if(await ask('Supprimer cette tâche ?')){state.tasks=state.tasks.filter(t=>t!==x);save();dlg.close()}};
}

/* ---------- dialogue projet ---------- */
async function openProject(id){
  let p=state.projects.find(q=>q.id===id);
  const isNew=!p;
  if(isNew)p={id:uid(),name:'',client:'',deadline:'',status:'todo',notes:'',versions:{},byTutor:tutor||undefined,created:Date.now()};
  p.versions=p.versions||{};
  dlg.innerHTML=`<div class="dlg">
    <div class="row between"><h2 class="title">${isNew?'Nouveau projet':'Projet'}</h2><span class="row">${p.byTutor?'<span class="chip tut">👩‍🏫 Attribué par le tuteur</span>':''}<button type="button" class="x" id="p_x" title="Fermer" style="font-size:26px">×</button></span></div>
    <label>Nom du projet<input id="p_name" value="${esc(p.name)}" placeholder="Ex : Logo client X" required></label>
    <div class="cols">
      <label>Client<input id="p_client" value="${esc(p.client||'')}" placeholder="Ex : Lovelace"></label>
      <label>Deadline<input type="date" id="p_deadline" value="${p.deadline}"></label>
      <label>État<select id="p_status">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${p.status===k?'selected':''}
        ${k==='done'&&!tutor&&p.status!=='done'?'disabled':''}>${k==='done'&&!tutor?v+' (validé par le tuteur)':v}</option>`).join('')}</select></label>
    </div>
    <label>Indications / consignes<textarea id="p_notes" placeholder="Brief, références, formats attendus, liens…">${esc(p.notes)}</textarea></label>
    <h4>Validation & retours du tuteur</h4>
    <div id="p_review" style="display:flex;flex-direction:column;gap:10px"></div>
    <h4>Tâches du projet</h4>
    <div id="p_tasks" style="display:flex;flex-direction:column;gap:6px"></div>
    <form id="p_taskadd" class="row" style="flex-wrap:nowrap"><input placeholder="+ Ajouter une tâche (recherches, esquisses, déclinaisons…)" style="flex:1;min-width:0">
      <input type="date" value="${workday(today())}" title="Jour où la tâche apparaît dans « Ma semaine »" style="width:auto;flex:none"><button class="btn">Ajouter</button></form>
    <h4>Fichiers du projet</h4>
    <div id="p_folders" style="display:flex;flex-direction:column;gap:12px"></div>
    <div class="row between" style="margin-top:6px">
      ${isNew?'<span></span>':'<button class="btn danger" id="p_del">Supprimer le projet</button>'}
      <button class="btn primary" id="p_ok">${isNew?'Créer':'Fermer'}</button>
    </div></div>`;
  dlg.showModal();
  const g=s=>dlg.querySelector(s);

  const commit=()=>{
    const prev=p.status;
    p.name=g('#p_name').value.trim()||'Sans titre'; p.client=g('#p_client').value.trim();
    p.deadline=g('#p_deadline').value; p.status=g('#p_status').value; p.notes=g('#p_notes').value;
    if(!state.projects.includes(p))state.projects.push(p);
    if(p.status==='review'&&prev!=='review'){p.status=prev;sendForReview(p);drawReview()}   // passage à « À valider » = envoi au tuteur
    finishProject(p); save();
  };
  const ensure=()=>{if(!state.projects.includes(p))commit()};
  if(!isNew)['#p_name','#p_client','#p_deadline','#p_status','#p_notes'].forEach(s=>g(s).addEventListener('input',commit));


  /* fichiers : la fiche renvoie vers les dossiers de l'onglet Fichiers (dépôt, nommage et validation s'y font) */
  const drawFolders=async()=>{
    const fs=state.projects.includes(p)?await filesOf(p.id):[];
    g('#p_folders').innerHTML=`<div class="pfgrid">${FOLDERS.map(([k,l])=>`<button type="button" class="pf" data-folder="${k}"><span>${l}</span><b>${fs.filter(f=>folderOf(f)===k).length}</b></button>`).join('')}</div>
      <div class="row"><button type="button" class="btn yellow" data-folder="">📁 Ouvrir les fichiers du projet</button>
      <span class="hint">Dépose et renomme tes fichiers dans l'onglet Fichiers.</span></div>`;
  };
  g('#p_folders').onclick=e=>{
    const b=e.target.closest('[data-folder]'); if(!b)return;
    if(isNew&&!g('#p_name').value.trim()){g('#p_name').focus();return}
    commit(); goFolder(p.id,b.dataset.folder);
  };

  /* validation : envoi au tuteur, décision du tuteur, corrections et commentaires sur les fichiers */
  const drawReview=async()=>{
    const fs=state.projects.includes(p)?await filesOf(p.id):[];
    const open=fs.flatMap(f=>(f.comments||[]).filter(c=>!c.resolved).map(c=>({f,c})));
    const hist=[...(p.reviews||[])].reverse(), lastFix=hist.find(r=>r.type==='fix');
    let h='';
    if(p.status==='done'&&p.validated)h+='<div class="vbox ok">✅ Projet validé par le tuteur.</div>';
    if(p.fix)h+=`<div class="vc">✏️ <b>Corrections demandées</b>${lastFix?.text?' : '+esc(lastFix.text):''}</div>`;
    if(!tutor&&p.status==='review')h+='<div class="vbox wait">⏳ Ton projet est entre les mains du tuteur. Tu seras prévenu ici de sa décision.</div>';
    if(!tutor&&p.status!=='review'&&p.status!=='done')
      h+=`<div class="row"><button type="button" class="btn primary" data-r="send">📤 ${p.fix?'Renvoyer après corrections':'Envoyer au tuteur pour validation'}</button>
        <span class="hint">Le projet passe en « À valider » et apparaît sur le tableau de bord du tuteur.</span></div>`;
    if(tutor&&p.status==='review')
      h+=`<div class="tutorbox"><label>Message pour ${esc(profile.first)}<textarea id="r_text" placeholder="Retours généraux, corrections à faire…"></textarea></label>
        <div class="row"><button type="button" class="btn primary" data-r="ok">✅ Valider le projet</button><button type="button" class="btn" data-r="fix">✏️ Demander des corrections</button></div>
        <div class="hint">Tu peux aussi commenter chaque fichier dans l'onglet Fichiers (bouton 💬).</div></div>`;
    if(open.length)h+=`<div class="kicker">Commentaires sur les fichiers (${open.length})</div>`+open.map(({f,c})=>
      `<div class="fcom" data-folder="${folderOf(f)}"><span><b>${esc(f.name)}</b><br>💬 ${esc(c.text)}</span><button type="button" class="btn sm" data-r="goto">Voir le fichier</button></div>`).join('');
    if(hist.length)h+=`<details><summary class="hint">Historique (${hist.length})</summary>${hist.map(r=>`<div class="hint">${fmt(r.date)} · ${REVIEW_LABEL[r.type]}${r.text?' — '+esc(r.text):''}</div>`).join('')}</details>`;
    g('#p_review').innerHTML=h||'<div class="hint">Quand le projet est prêt, envoie-le au tuteur pour validation.</div>';
  };
  g('#p_review').onclick=e=>{
    const b=e.target.closest('[data-r]'); if(!b)return;
    if(isNew&&!g('#p_name').value.trim()){g('#p_name').focus();return}
    commit(); const r=b.dataset.r;
    if(r==='send')sendForReview(p);
    else if(r==='ok'||r==='fix')reviewProject(p,r==='ok',g('#r_text').value.trim());
    else if(r==='goto')return goFolder(p.id,b.closest('.fcom').dataset.folder);
    g('#p_status').value=p.status; drawReview();
  };

  /* tâches du projet : ce sont les tâches de « Ma semaine » (même tâche, synchronisée partout) */
  const drawTasks=()=>{
    const ts=state.tasks.filter(t=>t.project===p.id).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
    g('#p_tasks').innerHTML=(ts.length?ts.map(t=>`<div class="file"><input type="checkbox" data-tid="${t.id}" ${t.done?'checked':''}>
      <span class="n" style="${t.done?'text-decoration:line-through;color:var(--muted)':''}">${esc(t.title)}</span>
      ${t.done?`<small>${fmt(t.date)}</small>`:`<input type="date" data-tdate="${t.id}" value="${t.date}" title="Changer le jour" style="width:auto;flex:none;padding:4px 6px;font-size:13px">`}
      <button type="button" class="x" data-tdel="${t.id}" title="Supprimer la tâche">×</button></div>`).join('')
      :'<div class="hint">Découpe le projet en petites tâches : elles apparaissent dans « Ma semaine » au jour choisi.</div>');
  };
  g('#p_taskadd').onsubmit=e=>{e.preventDefault();const [i,d]=e.target.querySelectorAll('input'),v=i.value.trim();if(!v)return;
    if(isNew&&!g('#p_name').value.trim()){g('#p_name').focus();return}
    ensure(); state.tasks.push({id:uid(),title:v,date:workday(d.value||today()),project:p.id,done:false,created:Date.now(),byTutor:tutor||undefined});
    i.value=''; save(); drawTasks(); i.focus();};
  g('#p_tasks').onchange=e=>{
    const id=e.target.dataset.tid||e.target.dataset.tdate, t=state.tasks.find(x=>x.id===id); if(!t)return;
    if(e.target.dataset.tid)completeTask(t,e.target.checked);
    else if(e.target.value){t.date=workday(e.target.value);t.from=null;save()}
    drawTasks();};
  g('#p_tasks').onclick=async e=>{const id=e.target.dataset?.tdel;if(!id)return;
    const t=state.tasks.find(x=>x.id===id); if(!t||!await ask(`Supprimer la tâche « ${t.title} » ?`))return;
    state.tasks=state.tasks.filter(x=>x!==t); save(); drawTasks();};
  drawFolders(); drawReview(); drawTasks();

  g('#p_ok').onclick=()=>{ if(isNew&&!g('#p_name').value.trim()){g('#p_name').focus();return} commit(); dlg.close(); };
  g('#p_x').onclick=()=>{ if(!isNew||g('#p_name').value.trim())commit(); dlg.close(); };   // nouveau projet sans nom : simple annulation
  const del=g('#p_del');
  if(del)del.onclick=async()=>{
    if(!await ask('Supprimer ce projet et tous ses fichiers ?'))return;
    for(const f of await filesOf(p.id))await delFile(f.id).catch(()=>{});
    state.projects=state.projects.filter(q=>q!==p);
    state.tasks.forEach(t=>{if(t.project===p.id)t.project=null});
    save(); dlg.close();
  };
}

const fileIn=$('#fileIn');
fileIn.onchange=async()=>{const p=state.projects.find(x=>x.id===ui.fileProject);
  if(p)await addToFolder(p,fileIn.dataset.folder,[...fileIn.files]); fileIn.value=''; render();};
main.addEventListener('click',async e=>{
  const drop=e.target.closest('.fdrop');
  if(drop){fileIn.dataset.folder=drop.dataset.folder;fileIn.click();return}
  const fa=e.target.closest('.fline [data-fa]');
  if(fa){
    const line=fa.closest('.fline'), p=state.projects.find(x=>x.id===line.dataset.pid), a=fa.dataset.fa;
    if(a==='ren'){await renameFile(line.dataset.fid,p);return render()}
    const f=(await filesOf(p.id)).find(x=>x.id===line.dataset.fid); if(!f)return;
    if(a==='rm'){if(await ask(`Supprimer « ${f.name} » ?`)){await delFile(f.id);await refreshCounts();render()}return}
    // commentaires du tuteur sur un fichier (visibles aussi dans la fiche projet du stagiaire)
    if(a==='comment'){
      const txt=await askText(`Commentaire pour ${profile.first}`,f.name); if(!txt)return;
      (f.comments=f.comments||[]).push({id:uid(),date:today(),text:txt,resolved:false});
      await putFile(f); await refreshCounts(); toast('💬 Commentaire ajouté'); return render();
    }
    if(a==='resolve'||a==='delc'){
      const cid=fa.closest('.fcom').dataset.cid;
      if(a==='resolve'){const c=f.comments.find(x=>x.id===cid);c.resolved=true;c.resolvedAt=today()}
      else f.comments=f.comments.filter(x=>x.id!==cid);
      await putFile(f); await refreshCounts(); return render();
    }
    if(a==='view')return openPreview(f,p,render);
    if(a==='open'||a==='reveal'){   // Google Drive : ouvre le vrai fichier (Illustrator, Acrobat…) ou son dossier
      const ok=await driveFiles()?.[a](f.rel);
      if(!ok)notify("Fichier introuvable dans le dossier Google Drive de ce poste : Google Drive est peut-être encore en train de le synchroniser.");
      return;
    }
    const blob=await Sync.blobOf(f); if(!blob)return notify(f.drive?"Ce fichier est rangé dans le Google Drive de l'agence : ouvre-le depuis l'appli installée ou directement dans le Drive."
      :"Ce fichier n'est pas encore disponible sur ce poste (pas de connexion ?).");
    const url=URL.createObjectURL(blob); setTimeout(()=>URL.revokeObjectURL(url),60000);
    const l=document.createElement('a');l.href=url;l.download=f.name;l.click();
    return;
  }
});

  flipTasks(()=>{if(moved){x.date=d.dataset.day;x.from=null;save()}render()},moved&&x.id,{x:e.clientX,y:e.clientY});});
// animation : la tâche déposée vole jusqu'à sa place et rebondit, les autres glissent pour lui faire de la place
function flipTasks(update,movedId,pt){
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const before=new Map([...main.querySelectorAll('.task[data-id]')].map(el=>[el.dataset.id,el.getBoundingClientRect()]));
  update();
  if(reduce)return;
  main.querySelectorAll('.task[data-id]').forEach(el=>{
    const r=el.getBoundingClientRect(), b=before.get(el.dataset.id);
    if(el.dataset.id===movedId){
      const dx=pt.x-(r.left+r.width/2), dy=pt.y-(r.top+r.height/2);
      el.animate([
        {transform:`translate(${dx}px,${dy}px) rotate(-3deg) scale(1.05)`,boxShadow:'0 14px 28px rgba(0,0,0,.28)'},
        {transform:'translate(0,0) rotate(1deg) scale(.97)',boxShadow:'0 2px 4px rgba(0,0,0,.1)',offset:.7},
        {transform:'none',boxShadow:'none'}],{duration:420,easing:'cubic-bezier(.2,.8,.3,1)'});
    }else if(b&&(b.left!==r.left||b.top!==r.top)){
      el.animate([{transform:`translate(${b.left-r.left}px,${b.top-r.top}px)`},{transform:'none'}],{duration:280,easing:'ease-out'});
    }
  });
}

const toDataURL=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});
async function exportData(){

  for(const f of await allFiles()){const b=await Sync.blobOf(f);if(b){const {path,uploaded,...rest}=f;files.push({...rest,blob:await toDataURL(b)})}}

/* ---------- alerte d'inactivité : ordinateur inactif 15 min pendant les heures de travail ---------- */
// IdleDetector (Chrome / Edge) mesure l'inactivité de tout l'ordinateur (clavier/souris dans n'importe quel logiciel),
// pas seulement dans l'onglet : travailler dans Illustrator compte bien comme de l'activité.
const IDLE_MIN=15;
const IDLE_MSGS=[
  "Ton écran commence à s'ennuyer… On s'y remet ? Choisis une petite tâche pour relancer la machine.",
  "Pas un clic depuis un moment. Si tu bloques sur quelque chose, c'est le bon moment pour demander à {t}.",
  "Petite pause qui s'éternise ? Aucun souci, mais ton projet t'attend. On repart sur la prochaine tâche ?",
  "Je commençais à m'endormir ici. On reprend doucement : ouvre ta liste du jour et attaque la plus simple.",
];
const idleSupported=()=>'IdleDetector' in window;
let idleCtrl=null, idleShown=false, audioCtx=null;
// heures où l'alerte a un sens : jours ouvrés du stage, 9h-18h, hors pause déjeuner (12h-14h)
function inWorkHours(){
  const n=new Date(), m=n.getHours()*60+n.getMinutes(), t=today();
  return !!profile&&!isWE(t)&&t>=profile.start&&t<=profile.end&&m>=9*60&&m<18*60&&!(m>=12*60&&m<14*60);
}
// l'alerte est un réglage du TUTEUR (activée par défaut) : le stagiaire ne peut pas la couper
const idleOn=pr=>!!pr&&pr.idleAlert!==false;
const IDLE_STATUS={ok:'en marche',prompt:'en attente d\'autorisation',denied:'bloquée par le navigateur',unsupported:'navigateur non compatible'};
function setIdleStatus(s){if(profile&&profile.idleStatus!==s){profile.idleStatus=s;save()}renderChrome()}
async function startIdleWatch(){
  stopIdleWatch();
  if(tutor||view!=='app'||!profile||!idleOn(profile))return;
  if(window.desktop)return setIdleStatus('ok');   // appli installée : la coquille mesure l'inactivité, sans autorisation
  if(PHONE)return;   // téléphone : rien à surveiller, et on ne touche pas au statut mesuré sur le PC
  if(!idleSupported())return setIdleStatus('unsupported');
  const perm=await navigator.permissions.query({name:'idle-detection'}).then(p=>p.state).catch(()=>'prompt');
  if(perm==='denied')return setIdleStatus('denied');
  if(perm!=='granted'){setIdleStatus('prompt');return askIdlePermission()}
  try{
    const det=new IdleDetector(); idleCtrl=new AbortController();
    det.addEventListener('change',()=>{
      // écran verrouillé = le stagiaire s'est absenté volontairement : pas d'alerte
      if(det.userState==='idle'&&det.screenState==='unlocked'&&inWorkHours()){idleAlert();reportPresence(true,IDLE_MIN*60)}
      else if(det.userState==='active')reportPresence(false);
    });
    await det.start({threshold:IDLE_MIN*60000,signal:idleCtrl.signal});
    setIdleStatus('ok');
  }catch(e){idleCtrl=null;setIdleStatus('denied')}
}
function stopIdleWatch(){if(idleCtrl){idleCtrl.abort();idleCtrl=null}}
// fenêtre obligatoire (pas de bouton Annuler) : le navigateur exige un clic du stagiaire pour donner l'autorisation
function askIdlePermission(){
  const d=$('#cdlg');
  d.innerHTML=`<div class="dlg" style="text-align:center;align-items:center"><h2 class="title">Alerte d'inactivité</h2>
    <p style="font-size:17px;margin:0">${esc(TUTOR_NAME)} a activé l'alerte d'inactivité : si l'ordinateur reste inactif ${IDLE_MIN} min pendant les heures de travail, ton compagnon te fera signe.<br>Le navigateur a besoin de ton autorisation pour surveiller l'activité de l'ordinateur.</p>
    <button class="btn primary big" data-ok>Autoriser</button></div>`;
  d.onclose=null; d.oncancel=e=>e.preventDefault(); d.showModal();
  d.querySelector('[data-ok]').onclick=async()=>{
    const p=await IdleDetector.requestPermission().catch(()=>'denied');
    d.oncancel=null; d.close();
    if(p==='granted')startIdleWatch(); else setIdleStatus('denied');
  };
}
// petit carillon généré (pas de fichier son) : do-mi-sol-do, joué deux fois
function playChime(){
  try{
    audioCtx=audioCtx||new AudioContext(); audioCtx.resume();
    const t0=audioCtx.currentTime;
    [0,1.1].forEach(rep=>[523.25,659.25,783.99,1046.5].forEach((f,i)=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain(), t=t0+rep+i*.16;
      o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.3,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.7);
      o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t+.75);
    }));
  }catch(e){}
}
// le son n'est autorisé qu'après une première interaction avec la page : on prépare l'audio au premier clic

// côté stagiaire : « inactif depuis… » puis « de retour », envoyés via la synchro (table settings, id presence:<profil>)
let presenceIdle=false;
function reportPresence(idle,seconds=0){
  if(!profile||tutor||view!=='app'||presenceIdle===idle)return;
  presenceIdle=idle;
  Sync.setPresence(profile.id,{idle,since:idle?Date.now()-seconds*1000:null,at:Date.now(),first:profile.first});
}
// côté tuteur : seulement sur le poste coché « Ce poste est celui du tuteur » (réglage local, pas synchronisé)
const POSTE_KEY='suivi-poste-tuteur';
const isTutorPC=()=>{try{return localStorage.getItem(POSTE_KEY)==='1'}catch(e){return false}};
const presence={}, alerted={};   // dernier état connu par stagiaire · début d'inactivité déjà signalé
const idleNow=()=>Object.entries(presence).filter(([pid,d])=>d.idle&&Date.now()-d.since<3*3600e3&&store.profiles.some(p=>p.id===pid));
function onPresence(pid,d){
  if(!d)return; presence[pid]=d;
  const pr=store.profiles.find(p=>p.id===pid);
  if(isTutorPC()&&pr){
    if(d.idle&&alerted[pid]!==d.since&&Date.now()-d.since<3*3600e3){alerted[pid]=d.since;tutorIdleAlert(pr,d)}
    else if(!d.idle&&alerted[pid]){delete alerted[pid];tutorBackAlert(pr)}
  }
  if(view==='admin'&&ui.atab!=='week'&&!dlg.open)render(); else pushWidget();
}

/* ---------- appli installée (coquille Windows / Mac) ---------- */
if(window.desktop){
  // inactivité de tout l'ordinateur, relevée toutes les 15 s par la coquille (secondes depuis le dernier clic / la dernière touche).
  // Un clic ou un petit mouvement de souris ne suffit pas : le compteur ne repart à zéro qu'après ACTIVE_NEED secondes
  // d'utilisation continue (une action dans chaque relevé de 15 s, sans trou).
  const TICK=15, ACTIVE_NEED=60;
  let idleArmed=true, streak=0, confirmed=Date.now();   // confirmed : dernière activité « réelle » (soutenue)
  window.onIdleTick=({seconds,locked},now=Date.now())=>{
    streak=seconds<TICK?streak+1:0;
    if(streak*TICK>=ACTIVE_NEED){confirmed=now-seconds*1000;idleArmed=true;reportPresence(false);return}
    const eff=Math.round((now-confirmed)/1000);   // inactivité « réelle », malgré les petits clics isolés
    if(!idleArmed||locked||tutor||view!=='app'||!idleOn(profile)||!inWorkHours())return;
    if(seconds<TICK)return;   // il est en train de s'y remettre : on lui laisse sa minute (pas d'alerte à 14h pile au retour de pause)
    if(eff>=IDLE_MIN*60){idleArmed=false;idleAlert();reportPresence(true,eff)}
    return eff;
  };
  window.desktop.onIdle(d=>window.onIdleTick(d));
  // quitter complètement l'appli demande le code tuteur (fermer la fenêtre la range seulement près de l'horloge)
  window.desktop.onQuitRequest(async()=>{
    if(!store.tutorPin)return window.desktop.quit();
    const pin=await askPin('Quitter l\'appli',`Entre le code tuteur pour fermer complètement Suivi Stagiaires. Fermer la fenêtre la range seulement près de l'horloge, et l'appli continue de fonctionner.`);
    if(pin==null)return;
    if(hash('tutor',pin)===store.tutorPin)window.desktop.quit(); else notify('Code tuteur incorrect.');
  });
  // nouvelle version de l'interface téléchargée en arrière-plan
  window.desktop.onUiUpdated(()=>ask('Une nouvelle version de l\'appli est prête.',{ok:'Mettre à jour maintenant',cancel:'Plus tard',danger:false})
    .then(y=>{if(y)window.desktop.reloadUi()}));
}
// compagnon flottant (appli installée) : visible quand la grande fenêtre est fermée ; il reçoit l'état et renvoie ses actions
function pushWidget(){
  const W=window.desktop; if(!W?.widgetState)return;
  // poste tuteur (hors espace d'un stagiaire) : l'ours de l'appli, les tâches du tuteur et les stagiaires inactifs
  if(isTutorPC()&&!(view==='app'&&!tutor)){
    const t=today(), rank={high:0,undefined:1,low:2};
    const tasks=store.tutorData.tasks.filter(x=>x.date===t).sort((a,b)=>a.done-b.done||rank[a.prio]-rank[b.prio]||a.created-b.created);
    W.widgetEnable(true);
    W.widgetState({mode:'tutor',first:'Espace tuteur',img:'assets/icons/icon-192.png',title:'Suivi Stagiaires',
      tasks:tasks.map(x=>({id:x.id,title:x.title,done:!!x.done,prio:x.prio})),
      idle:idleNow().map(([pid,d])=>{const pr=store.profiles.find(p=>p.id===pid);return `${pr.first} · inactif depuis ${sinceTxt(d)}`})});
    return;
  }
  if(view!=='app'||tutor||!profile||!state.player?.species){W.widgetEnable(false);return}
  const p=state.player, L=levelOf(p.xp), c=charOf(L), lo=need(L), hi=need(L+1), t=today(), rank={high:0,undefined:1,low:2};
  W.widgetEnable(true);
  W.widgetState({first:profile.first,img:c.img,title:c.title,level:L,xpPct:Math.round((p.xp-lo)/(hi-lo)*100),xpTxt:`${p.xp-lo}/${hi-lo} XP`,
    tasks:state.tasks.filter(x=>x.date===t).sort((a,b)=>a.done-b.done||rank[a.prio]-rank[b.prio]||a.created-b.created)
      .map(x=>({id:x.id,title:x.title,done:!!x.done,prio:x.prio}))});
}

// (la coquille signale quand la fenêtre est rangée, la page elle-même reste « visible » pour garder ses minuteries)
let appHidden=false; const visWaiters=[];
window.desktop?.onAppVisible?.(v=>{appHidden=!v;if(v)visWaiters.splice(0).forEach(r=>r())});
